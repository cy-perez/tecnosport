# La misma verificación que se corre en local, corrida por GitHub en cada pull request.
#
# Los dos trabajos ejecutan `tools/verificar.mjs`, **el mismo archivo** que `npm run verificar`,
# con una bandera que elige la mitad. Podrían haber sido dos listas de comandos escritas aquí, y
# ese es justo el error: el día que se agregue un paso al script, esa lista no se enteraría y CI
# dejaría de significar lo que significa en la máquina de quien programa.
name: verificar

on:
  pull_request:
  # También al mezclar: dos pull requests verdes por separado pueden romper juntas.
  push:
    branches: [main]

# Una corrida por rama. Si llegan dos empujones seguidos, la vieja se cancela en vez de gastar
# ejecutores compitiendo por un resultado que ya no le importa a nadie.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Sin filtros por ruta a propósito, aunque `docs/07-infra-gcp.md` los pida. Con `paths:`, el
# trabajo que no aplica no se salta: se queda *pendiente para siempre*, y una comprobación
# obligatoria pendiente bloquea el merge sin decir por qué. Los dos corren en paralelo, el
# repositorio es público —o sea que los minutos no se cobran— y con la caché puesta el que sobra
# cuesta unos minutos de reloj, no de dinero. Si algún día molesta la espera, se resuelve con un
# trabajo que decida por ruta y reporte "éxito" cuando no aplica, no con `paths:`.
jobs:
  web:
    name: web · capas, contrastes, lint, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Python y fontTools son para el guardián del kit, que desde el recorte de las tipografías
      # no solo comprueba que se regeneren igual: mira **dentro** de cada woff2 que el sitio
      # pueda escribir lo que escribe. Sin fontTools esa comprobación no se puede hacer, y
      # `verificar-kit.mjs` falla aquí a propósito en vez de saltársela —"no comprobado" no es
      # "está bien"—. El ejecutor trae `python3`, pero no la librería.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet fonttools brotli
      - run: npm ci
      - run: node tools/verificar.mjs --solo-web

  api:
    name: api · compilación, pruebas, ArchUnit y Spotless
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # Node no es para el backend: `verificar.mjs` es un script de Node y es quien invoca a
      # Gradle. No hace falta `npm ci` — el script no importa ninguna dependencia.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # Las pruebas de `infrastructure` levantan PostgreSQL con Testcontainers, así que este
      # trabajo necesita Docker: los ejecutores `ubuntu-latest` ya lo traen, no hay que montarlo.
      - run: node tools/verificar.mjs --solo-api


# El contrato ya no tiene trabajo propio, y no porque se haya dejado de vigilar.
#
# Aquí hubo un tercer trabajo que levantaba PostgreSQL, arrancaba `bootRun`, esperaba hasta cinco
# minutos a que respondiera, regeneraba `packages/contratos/src/tipos.ts` y exigía que el diff
# quedara vacío. Hacía falta porque la única forma de conocer el OpenAPI era pedírselo a un
# backend vivo. Con la instantánea guardada en `packages/contratos/openapi.json` ya no lo es, y la
# misma comprobación quedó partida en dos eslabones que corren donde ya se corría todo:
#
#   - que la instantánea sea lo que la aplicación sirve de verdad → `ContratoOpenApiTest`, dentro
#     del build de la API (trabajo `api`), con Testcontainers y sin ningún puerto;
#   - que el cliente generado corresponda a la instantánea → `tools/verificar-contratos.mjs`,
#     dentro de `verificar.mjs` (trabajo `web`), sin red y en menos de un segundo.
#
# Lo que se gana no es el minuto de ejecutor: es que las dos fallan también en la máquina de quien
# programa, antes del empujón. Un guardián que solo vive en integración continua avisa cuando el
# trabajo ya está hecho y la rama ya está subida.
