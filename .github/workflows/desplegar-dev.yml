# Despliegue del ambiente de desarrollo: construye las dos imágenes, las sube al registro y mueve
# las revisiones de Cloud Run.
#
# Corre al mezclar a `develop` y no después de que `verificar` termine, porque `develop` está
# protegida: nada llega ahí sin los trabajos de integración continua en verde, así que lo que se
# despliegue ya pasó por ellos. Lo que este flujo agrega es comprobar la salud del servicio después
# de mover el tráfico y **revertir a la revisión anterior si no responde** — que es la protección
# que importa cuando algo pasa las pruebas y se cae igual.
#
# Y desde ADR-0106 es la puerta de producción: el nombre del trabajo `construir, subir y desplegar`
# es una comprobación obligatoria de `main`, así que el PR de liberación no se puede fusionar si la
# punta de `develop` no quedó sana en dev. Renombrar el trabajo deja `main` esperando para siempre
# una comprobación que ya no existe.
#
# **Sin llaves JSON.** Se autentica con federación de identidad: GitHub presenta un token firmado
# de esta ejecución y GCP lo cambia por credenciales de minutos, solo para este repositorio (la
# condición está en `infra/envs/dev/main.tf`).
name: desplegar dev

# Al mezclar a `develop`, y también a demanda desde esa rama: la federación de dev solo entrega
# credenciales a `refs/heads/develop` (`infra/envs/dev/main.tf`). Fue `main` hasta ADR-0106, cuando
# `main` pasó a ser lo que está en producción.
on:
  push:
    branches: [develop]
  workflow_dispatch:

# Un despliegue a la vez, y **sin cancelar el que va**: matar un `gcloud run deploy` a mitad deja
# el servicio en un estado que nadie pidió. Los demás flujos sí se cancelan; este espera.
concurrency:
  group: desplegar-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # lo exige la federación de identidad

env:
  REGION: us-east1
  SERVICIO_API: tecnosport-api
  SERVICIO_WEB: tecnosport-web

jobs:
  desplegar:
    name: construir, subir y desplegar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROYECTO_DEV }}
          workload_identity_provider: ${{ vars.GCP_PROVEEDOR_IDENTIDAD }}
          service_account: ${{ vars.GCP_CUENTA_DESPLIEGUE }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Autorizar Docker contra Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # La etiqueta es el SHA del commit y no `latest`: así una revisión de Cloud Run dice de qué
      # código salió, y revertir es apuntar a una imagen concreta en vez de adivinar cuál era.
      #
      # La de las migraciones no la usa dev, que migra desde aquí mismo: se construye para que
      # producción tenga la del mismo SHA que promover (ADR-0105).
      - name: Construir y subir las tres imágenes
        run: |
          for app in api web api/migraciones; do
            nombre="tecnosport-${app//\//-}"
            imagen="${{ vars.GCP_REGISTRO_IMAGENES }}/$nombre:${{ github.sha }}"
            echo "::group::$nombre"
            docker build -f "apps/$app/Dockerfile" -t "$imagen" .
            docker push "$imagen"
            echo "::endgroup::"
          done

      # ── Migraciones, en un paso propio y antes de mover la revisión ─────────────────────────
      # No al arrancar la aplicación, que es como corre en local: con varias instancias, dos
      # arranques migrando la misma base es una carrera (Flyway la resuelve con un bloqueo, pero
      # entonces el arranque de un contenedor depende de cuánto tarde una migración ajena), y un
      # fallo se ve como "la revisión no arrancó" sin decir por qué. Aquí falla con el registro de
      # Flyway a la vista y el despliegue se detiene **antes** de tocar el tráfico.
      #
      # El servicio lleva SPRING_FLYWAY_ENABLED=false, así que si este paso se salta, la
      # aplicación no migra por su cuenta: Hibernate valida el esquema y la revisión falla en voz
      # alta. Es lo que se quiere — un esquema a medias es peor que un despliegue detenido.
      #
      # La versión de la imagen es la misma que trae Spring Boot (flyway-core 12.4.0): dos
      # versiones distintas de Flyway pueden discrepar sobre el formato de su propia tabla de
      # historial.
      - name: Migrar la base
        run: |
          # Host, base y usuario se leen del servicio desplegado en vez de repetirlos aquí:
          # Terraform es el dueño de esos valores y así no hay dos copias que se desincronicen.
          # `spec.template.spec.containers` y no `template.containers`: `gcloud run services
          # describe --format=json` devuelve el objeto al estilo Knative, no la forma de la API v2
          # que usa Terraform. Con la ruta de la v2 esto encontraba una lista vacía y el paso
          # fallaba diciendo que faltaba DB_HOST cuando estaba puesto.
          entorno=$(gcloud run services describe "${{ env.SERVICIO_API }}" \
            --region "${{ env.REGION }}" --format=json \
            | jq -c '.spec.template.spec.containers[0].env')
          valor() { echo "$entorno" | jq -r --arg n "$1" '.[] | select(.name==$n) | .value'; }
          host=$(valor DB_HOST); base=$(valor DB_NOMBRE); usuario=$(valor DB_USUARIO)
          params=$(valor DB_PARAMS)
          if [ -z "$host" ]; then
            echo "::error::El servicio no tiene DB_HOST: falta aplicar Terraform con los datos de la base"
            exit 1
          fi

          clave=$(gcloud secrets versions access latest --secret=db-clave)
          echo "::add-mask::$clave"

          echo "Migrando $usuario@$host/$base"
          docker run --rm \
            -v "$PWD/apps/api/infrastructure/src/main/resources/db/migration:/flyway/sql:ro" \
            -e FLYWAY_PASSWORD="$clave" \
            flyway/flyway:12.4.0 \
            -url="jdbc:postgresql://$host:5432/$base$params" \
            -user="$usuario" \
            -connectRetries=10 \
            -connectRetriesInterval=6 \
            migrate

      # La API primero: la web la consulta al renderizar, y desplegarlas al revés deja una ventana
      # en la que el SSR pide contratos que el backend todavía no sirve.
      - name: Desplegar la API
        run: |
          gcloud run deploy "${{ env.SERVICIO_API }}" \
            --image "${{ vars.GCP_REGISTRO_IMAGENES }}/tecnosport-api:${{ github.sha }}" \
            --region "${{ env.REGION }}" \
            --quiet

      - name: Desplegar la web
        run: |
          gcloud run deploy "${{ env.SERVICIO_WEB }}" \
            --image "${{ vars.GCP_REGISTRO_IMAGENES }}/tecnosport-web:${{ github.sha }}" \
            --region "${{ env.REGION }}" \
            --quiet

      # Que Cloud Run acepte la revisión no significa que el sitio funcione: el contenedor puede
      # levantar y la aplicación responder 500 a todo. Esto es lo que separa "desplegado" de
      # "sirviendo".
      - name: Comprobar que responden
        id: salud
        run: |
          api=$(gcloud run services describe "${{ env.SERVICIO_API }}" --region "${{ env.REGION }}" --format='value(status.url)')
          web=$(gcloud run services describe "${{ env.SERVICIO_WEB }}" --region "${{ env.REGION }}" --format='value(status.url)')
          echo "API en $api"
          echo "web en $web"

          # Con reintentos y con paciencia: la primera petición paga el arranque en frío de la JVM,
          # que en este ambiente no tiene instancias en reposo a propósito.
          for intento in 1 2 3 4 5 6; do
            estado=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$api/api/v1/salud" || echo 000)
            [ "$estado" = "200" ] && break
            echo "salud de la API: $estado (intento $intento)"
            sleep 10
          done
          [ "$estado" = "200" ] || { echo "::error::La API no responde 200 en /api/v1/salud"; exit 1; }

          # La web no se da por sana con un 200, y la razón la aprendió sendik antes que nosotros:
          # `@angular/ssr` **renuncia al renderizado en servidor** si le llega una cabecera
          # `x-forwarded-*` que no esté declarada como confiable, y en ese caso entrega la página
          # de cliente — raíz vacía, sin estado transferido, y estado 200. El sitio queda en blanco
          # para todo el mundo y esta comprobación lo daba por bueno. `NG_TRUST_PROXY_HEADERS` está
          # puesto en Terraform; esto es lo que avisa el día que deje de estarlo.
          #
          # Se pide por la URL de `run.app` a propósito: es el camino que recorre un visitante, con
          # el proxy de Google delante y por tanto con esas cabeceras puestas.
          for intento in 1 2 3 4 5 6; do
            estado=$(curl -s -o portada.html -D cabeceras.txt -w '%{http_code}' \
              --compressed --max-time 60 "$web/es" || echo 000)
            [ "$estado" = "200" ] && break
            echo "salud de la web: $estado (intento $intento)"
            sleep 10
          done
          [ "$estado" = "200" ] || { echo "::error::La web no responde 200 en /es"; exit 1; }

          if grep -q '<app-root></app-root>' portada.html; then
            echo "::error::Respondió 200 pero la página llegó SIN renderizar: <app-root> viene vacía."
            echo "Es la renuncia al SSR de @angular/ssr por cabeceras x-forwarded-* no declaradas."
            exit 1
          fi

          # Y la comprobación en positivo, porque «la raíz no está vacía» también lo cumple un
          # error pintado por el cliente: el estado transferido solo existe si se renderizó en el
          # servidor de verdad.
          grep -q 'ng-state' portada.html || {
            echo "::error::Respondió 200 y con marcado, pero sin estado transferido."
            exit 1
          }

          # La compresión no se puede afirmar desde Vitest —montar el motor de Angular exige el
          # manifiesto que solo existe tras construir— así que se afirma aquí, contra el servicio
          # ya desplegado, que es donde la afirmación significa algo. Sin esto, la portada vuelve a
          # pesar 664 KB en vez de 211 KB y nada se pone rojo.
          #
          # Cualquier codificación, no `gzip` a secas: `compression` negocia **brotli** cuando el
          # cliente lo acepta, que es lo que hace todo navegador y lo que hace `curl --compressed`.
          # Escrita contra `gzip`, esta comprobación fallaba con la compresión funcionando
          # perfectamente — encontrado al probarla contra el servidor construido, no en revisión.
          grep -qiE '^content-encoding: (br|gzip|deflate|zstd)' cabeceras.txt || {
            echo "::error::La web responde sin comprimir: falta el middleware de compresión en server.ts"
            grep -i '^content-encoding' cabeceras.txt || echo "(no vino ninguna cabecera content-encoding)"
            exit 1
          }

          echo "Las dos responden, la web renderizada en servidor y comprimida."

      # Producción solo promueve lo que llegó hasta aquí (ADR-0105). Las imágenes se suben antes de
      # migrar y de desplegar, así que la del SHA existe aunque su migración haya fallado o su
      # salud se haya revertido: lo que separa una de otra es esta segunda etiqueta.
      - name: Marcar las imágenes como verificadas en dev
        run: |
          for nombre in tecnosport-api tecnosport-web tecnosport-api-migraciones; do
            gcloud artifacts docker tags add \
              "${{ vars.GCP_REGISTRO_IMAGENES }}/$nombre:${{ github.sha }}" \
              "${{ vars.GCP_REGISTRO_IMAGENES }}/$nombre:verificado-${{ github.sha }}" \
              --quiet
          done

      # Solo si la comprobación falló. Devuelve el tráfico a la revisión anterior, que es la que
      # estaba sirviendo hace un minuto y de la que sabemos que funcionaba.
      - name: Revertir si la salud falló
        if: failure() && steps.salud.outcome == 'failure'
        run: |
          for servicio in "${{ env.SERVICIO_API }}" "${{ env.SERVICIO_WEB }}"; do
            anterior=$(gcloud run revisions list \
              --service "$servicio" --region "${{ env.REGION }}" \
              --sort-by '~metadata.creationTimestamp' \
              --format 'value(metadata.name)' --limit 2 | tail -1)
            if [ -n "$anterior" ]; then
              echo "::warning::Revirtiendo $servicio a $anterior"
              gcloud run services update-traffic "$servicio" \
                --region "${{ env.REGION }}" --to-revisions "$anterior=100" --quiet
            else
              echo "::warning::$servicio no tiene revisión anterior a la cual volver"
            fi
          done

  # Lo que quedó sano en dev queda listo para producción en un PR `develop → main` que se abre solo
  # y se actualiza en cada despliegue; fusionarlo es la decisión humana de publicar (ADR-0106).
  #
  # Con `TOKEN_FUSION` y no con el token del flujo: un PR abierto con `GITHUB_TOKEN` no dispara
  # ningún flujo de `pull_request`, y entonces `origen-de-main` nunca corre y la comprobación
  # obligatoria se queda pendiente para siempre.
  liberacion:
    name: abrir o actualizar el PR de liberación
    needs: desplegar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Abrir o actualizar el PR develop → main
        env:
          GH_TOKEN: ${{ secrets.TOKEN_FUSION }}
        run: |
          # `--first-parent` lista lo que se fusionó en develop —un renglón por PR— y no cada
          # commit de cada rama.
          cambios=$(git log --first-parent --format='- %s (%h)' origin/main..origin/develop)
          if [ -z "$cambios" ]; then
            echo "develop no tiene nada que main no tenga"
            exit 0
          fi

          {
            echo "Liberación a producción de lo que ya quedó sano en dev."
            echo
            echo "Al fusionar, \`desplegar producción\` promueve las imágenes de \`${{ github.sha }}\`,"
            echo "las mismas que corren en dev, sin reconstruirlas. **Fusionar con commit de fusión**,"
            echo "nunca con squash ni rebase (ADR-0106)."
            echo
            echo "## Cambios"
            echo
            echo "$cambios"
          } > cuerpo.md

          pr=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file cuerpo.md
            echo "PR #$pr actualizado"
          else
            gh pr create --base main --head develop \
              --title "Liberación a producción" --body-file cuerpo.md
          fi
