services:
  postgres:
    image: postgres:16
    # Debe coincidir con DB_NOMBRE/DB_USUARIO/DB_CLAVE en .env.example.
    # docker compose no lee .env.local para interpolar ${...} (solo .env), así
    # que aquí van fijos en vez de referenciarlos.
    environment:
      POSTGRES_DB: tecnosport
      POSTGRES_USER: tecnosport
      POSTGRES_PASSWORD: tecnosport
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
