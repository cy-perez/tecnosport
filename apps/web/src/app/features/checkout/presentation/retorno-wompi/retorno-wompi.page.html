<section class="mx-auto max-w-contenido px-16 py-32 text-center">
  @if (sinDatos()) {
    <p class="mb-16 text-ts-error" role="alert">
      {{ 'checkout.retornoWompi.sin_datos' | transloco }}
    </p>
    <a class="anillo-foco text-ts-primario" [routerLink]="['../../productos']">
      {{ 'checkout.resumen.ir_al_catalogo' | transloco }}
    </a>
  } @else {
    <ts-esqueleto />
    <!-- Igual que el "cargando" de verificar-correo: esta region solo existe durante la primera
         pintura -la pantalla se va sola en cuanto la pasarela responde-, y una region viva que ya
         esta en la pagina cuando termina de cargar no se anuncia nunca. Hacerla permanente no
         cambiaria nada; queda dicho para que nadie lo intente. Ver `docs/06-testing.md`. -->
    <p class="mt-16 text-ts-texto-suave" role="status">
      {{ 'checkout.retornoWompi.verificando' | transloco }}
    </p>
  }
</section>
