<!-- Mobile-first, y no era así: las cinco columnas iban sin variante, o sea
     también en el teléfono, donde no caben. Medido a 380 px: el documento se
     iba a 521 px y el sitio entero se desplazaba en horizontal.

     En móvil van dos columnas —la foto y el resto— y los tres controles
     (cantidad, precio, eliminar) bajan a la columna 2 con `col-start-2`. Sin
     eso caen en la columna de la foto, que mide 96 px fijos: el selector de
     cantidad son dos botones de 60 px más el número, así que se desbordaba de
     su propia celda. Con la columna 2 tiene 219 px. -->
<article
  class="grid grid-cols-[var(--esp-96)_1fr] items-center gap-16 border-b border-ts-borde py-16 desde-movil:grid-cols-[var(--esp-96)_1fr_auto_auto_auto]"
>
  @if (snapshot(); as foto) {
    @if (foto.imagenUrl) {
      <img
        class="size-96 bg-ts-superficie-alt object-cover"
        [ngSrc]="foto.imagenUrl"
        width="96"
        height="96"
        [alt]="foto.imagenAlt"
      />
    } @else {
      <div class="block size-96 bg-ts-superficie-alt object-cover" aria-hidden="true"></div>
    }
    <div class="flex min-w-0 flex-col gap-4">
      <p class="m-0 font-medio">{{ foto.nombreProducto }}</p>
      <p class="m-0 text-sm text-ts-texto-suave">{{ foto.sku }}</p>
    </div>
  } @else {
    <div class="block size-96 bg-ts-superficie-alt object-cover" aria-hidden="true"></div>
    <div class="flex min-w-0 flex-col gap-4">
      <p class="m-0 font-medio">{{ 'carrito.producto_sin_foto' | transloco }}</p>
    </div>
  }

  <div class="col-start-2 flex items-center gap-8 desde-movil:col-start-auto">
    <ts-boton
      variante="secundario"
      [deshabilitado]="deshabilitado() || linea().cantidad <= 1"
      [etiquetaAccesible]="'carrito.disminuir' | transloco"
      (click)="restar()"
    >
      −
    </ts-boton>
    <span class="min-w-[2ch] text-center">{{ linea().cantidad }}</span>
    <ts-boton
      variante="secundario"
      [deshabilitado]="deshabilitado()"
      [etiquetaAccesible]="'carrito.aumentar' | transloco"
      (click)="sumar()"
    >
      +
    </ts-boton>
  </div>

  @if (subtotal(); as valor) {
    <ts-precio
      class="col-start-2 desde-movil:col-start-auto"
      [valor]="valor"
      [moneda]="snapshot()?.precioMoneda ?? 'COP'"
    />
  }

  <ts-boton
    class="col-start-2 desde-movil:col-start-auto"
    variante="texto"
    [deshabilitado]="deshabilitado()"
    (click)="eliminar.emit()"
  >
    {{ 'carrito.eliminar' | transloco }}
  </ts-boton>
</article>
