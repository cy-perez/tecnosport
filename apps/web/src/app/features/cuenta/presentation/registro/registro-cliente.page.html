@if (registrado()) {
  <ts-pagina-formulario [titulo]="'cuenta.registro.exito_titulo' | transloco">
    <p>{{ 'cuenta.registro.exito_mensaje' | transloco }}</p>
  </ts-pagina-formulario>
} @else {
  <ts-pagina-formulario [titulo]="'cuenta.registro.titulo' | transloco">
    <form
      class="flex flex-col gap-16"
      [formGroup]="form"
      (submit)="$event.preventDefault(); enviar()"
    >
      <ts-campo
        idCampo="registro-correo"
        tipo="email"
        [label]="'cuenta.registro.correo' | transloco"
        formControlName="correo"
      />

      <ts-campo
        idCampo="registro-clave"
        tipo="password"
        [label]="'cuenta.registro.clave' | transloco"
        formControlName="clave"
      />

      <ts-campo
        idCampo="registro-confirmar-clave"
        tipo="password"
        [label]="'cuenta.registro.confirmarClave' | transloco"
        formControlName="confirmarClave"
        [error]="clavesNoCoinciden() ? ('cuenta.registro.error_confirmar_clave' | transloco) : null"
      />

      <!--
        La autorización de datos va en su propia casilla y separada de todo lo demás: es un
        consentimiento distinto del de los términos, y meterlos juntos lo invalida. El enlace a la
        política va al lado y no dentro del <label>, porque un enlace dentro de la etiqueta se pelea
        con el objetivo de clic de la casilla.
      -->
      <div class="flex flex-col gap-4">
        <ts-checkbox
          idCasilla="registro-autoriza-datos"
          [etiqueta]="'cuenta.registro.autoriza_datos' | transloco"
          [marcado]="form.controls.autorizaDatos.value"
          (marcadoCambio)="form.controls.autorizaDatos.setValue($event)"
        />
        <a
          class="anillo-foco inline-flex min-h-tactil items-center text-sm text-ts-primario"
          [routerLink]="['/', idioma(), 'legales', 'privacidad']"
          >{{ 'cuenta.registro.ver_politica' | transloco }}</a
        >
      </div>

      @if (error()) {
        <p class="m-0 text-ts-error" role="alert">{{ error() }}</p>
      }

      <ts-boton
        variante="primario"
        tipo="submit"
        [deshabilitado]="formularioInvalido()"
        [cargando]="enviando()"
        [etiquetaCargando]="'cuenta.registro.enviando' | transloco"
      >
        {{ 'cuenta.registro.crear_cuenta' | transloco }}
      </ts-boton>
    </form>
  </ts-pagina-formulario>
}
