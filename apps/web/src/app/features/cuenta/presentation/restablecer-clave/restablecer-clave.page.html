@if (restablecida()) {
  <ts-pagina-formulario [titulo]="'cuenta.restablecerClave.exito_titulo' | transloco">
    <p>{{ 'cuenta.restablecerClave.exito_mensaje' | transloco }}</p>
  </ts-pagina-formulario>
} @else if (!token) {
  <ts-pagina-formulario [titulo]="'cuenta.restablecerClave.error_titulo' | transloco">
    <p role="alert">{{ 'cuenta.restablecerClave.error_token_invalido' | transloco }}</p>
  </ts-pagina-formulario>
} @else {
  <ts-pagina-formulario [titulo]="'cuenta.restablecerClave.titulo' | transloco">
    <form
      class="flex flex-col gap-16"
      [formGroup]="form"
      (submit)="$event.preventDefault(); enviar()"
    >
      <ts-campo
        idCampo="restablecer-clave-nueva"
        tipo="password"
        [label]="'cuenta.restablecerClave.claveNueva' | transloco"
        formControlName="claveNueva"
      />

      <ts-campo
        idCampo="restablecer-confirmar-clave"
        tipo="password"
        [label]="'cuenta.restablecerClave.confirmarClave' | transloco"
        formControlName="confirmarClave"
        [error]="
          clavesNoCoinciden() ? ('cuenta.restablecerClave.error_confirmar_clave' | transloco) : null
        "
      />

      @if (error()) {
        <p class="m-0 text-ts-error" role="alert">{{ error() }}</p>
      }

      <ts-boton
        variante="primario"
        tipo="submit"
        [deshabilitado]="formularioInvalido()"
        [cargando]="enviando()"
        [etiquetaCargando]="'cuenta.restablecerClave.enviando' | transloco"
      >
        {{ 'cuenta.restablecerClave.restablecer' | transloco }}
      </ts-boton>
    </form>
  </ts-pagina-formulario>
}
