<section class="iniciar-sesion-cliente">
  <h1 class="iniciar-sesion-cliente__titulo">{{ 'cuenta.iniciarSesion.titulo' | transloco }}</h1>

  <form class="iniciar-sesion-cliente__formulario" [formGroup]="form" (submit)="$event.preventDefault(); enviar()">
    <ts-campo
      idCampo="cuenta-correo"
      tipo="email"
      [label]="'cuenta.iniciarSesion.correo' | transloco"
      formControlName="correo"
    />

    <ts-campo
      idCampo="cuenta-clave"
      tipo="password"
      [label]="'cuenta.iniciarSesion.clave' | transloco"
      formControlName="clave"
    />

    @if (error()) {
      <p class="iniciar-sesion-cliente__error" role="alert">{{ error() }}</p>
    }

    <a class="iniciar-sesion-cliente__olvidaste" [routerLink]="['../recuperar-clave']">
      {{ 'cuenta.iniciarSesion.olvidaste_clave' | transloco }}
    </a>

    <ts-boton
      variante="primario"
      tipo="submit"
      [deshabilitado]="formularioInvalido()"
      [cargando]="enviando()"
      [etiquetaCargando]="'cuenta.iniciarSesion.enviando' | transloco"
    >
      {{ 'cuenta.iniciarSesion.entrar' | transloco }}
    </ts-boton>
  </form>
</section>
