<ts-pagina-formulario [titulo]="'admin.productos.crear.titulo' | transloco">
  <ts-migas [ruta]="migas()" />

  <form
    class="flex flex-col gap-16"
    [formGroup]="form"
    (submit)="$event.preventDefault(); enviar()"
  >
    <ts-campo
      idCampo="crear-producto-nombre"
      [label]="'admin.productos.crear.nombre' | transloco"
      [obligatorio]="true"
      formControlName="nombre"
    />

    <ts-campo
      idCampo="crear-producto-descripcion"
      [label]="'admin.productos.crear.descripcion' | transloco"
      formControlName="descripcion"
    />

    <ts-select
      idCampo="crear-producto-marca"
      [label]="'admin.productos.crear.marca' | transloco"
      [opciones]="opcionesMarca()"
      [placeholder]="'admin.productos.crear.seleccionar' | transloco"
      [obligatorio]="true"
      formControlName="marcaId"
    />

    <ts-select
      idCampo="crear-producto-categoria"
      [label]="'admin.productos.crear.categoria' | transloco"
      [opciones]="opcionesCategoria()"
      [placeholder]="'admin.productos.crear.seleccionar' | transloco"
      formControlName="categoriaId"
    />

    <p class="m-0 text-ts-error" role="alert">{{ error() }}</p>

    <ts-boton
      variante="primario"
      tipo="submit"
      [cargando]="enviando()"
      [etiquetaCargando]="'admin.productos.crear.enviando' | transloco"
    >
      {{ 'admin.productos.crear.crear' | transloco }}
    </ts-boton>
  </form>

  <!-- Fuera del formulario, y esa es toda la decisión: navegar de aquí descarta lo que se lleve
       escrito, y estaba **entre el select de marca y el de categoría**. Tabulando el formulario se
       llegaba a él con Enter a un dedo de distancia, y quien navega con teclado perdía todo sin
       una sola pregunta. El momento en que se descubre que falta la marca sigue siendo el de
       elegirla; lo que cambia es que ahora hay que ir a buscar el enlace, que es lo correcto para
       algo que tira el trabajo a la basura. El costo está escrito en marcas-admin.page.ts. -->
  <p class="mt-24">
    <a
      class="anillo-foco inline-flex min-h-tactil items-center text-ts-primario"
      routerLink="../../marcas"
      >{{ 'admin.productos.crear.faltaMarca' | transloco }}</a
    >
  </p>
</ts-pagina-formulario>
