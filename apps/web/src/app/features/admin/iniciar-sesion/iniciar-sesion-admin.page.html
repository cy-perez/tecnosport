<ts-pagina-formulario [titulo]="'admin.iniciarSesion.titulo' | transloco">
  <form
    class="flex flex-col gap-16"
    [formGroup]="form"
    (submit)="$event.preventDefault(); enviar()"
  >
    <ts-campo
      idCampo="admin-correo"
      tipo="email"
      [label]="'admin.iniciarSesion.correo' | transloco"
      formControlName="correo"
    />

    <ts-campo
      idCampo="admin-clave"
      tipo="password"
      [label]="'admin.iniciarSesion.clave' | transloco"
      formControlName="clave"
    />

    @if (error()) {
      <p class="m-0 text-ts-error" role="alert">{{ error() }}</p>
    }

    <ts-boton
      variante="primario"
      tipo="submit"
      [deshabilitado]="formularioInvalido()"
      [cargando]="enviando()"
      [etiquetaCargando]="'admin.iniciarSesion.enviando' | transloco"
    >
      {{ 'admin.iniciarSesion.entrar' | transloco }}
    </ts-boton>
  </form>
</ts-pagina-formulario>
