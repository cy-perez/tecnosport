<section class="iniciar-sesion-admin">
  <h1 class="iniciar-sesion-admin__titulo">{{ 'admin.iniciarSesion.titulo' | transloco }}</h1>

  <form class="iniciar-sesion-admin__formulario" [formGroup]="form" (submit)="$event.preventDefault(); enviar()">
    <ts-campo
      idCampo="admin-correo"
      tipo="email"
      [label]="'admin.iniciarSesion.correo' | transloco"
      formControlName="correo"
    />

    <ts-campo
      idCampo="admin-clave"
      tipo="password"
      [label]="'admin.iniciarSesion.clave' | transloco"
      formControlName="clave"
    />

    @if (error()) {
      <p class="iniciar-sesion-admin__error" role="alert">{{ error() }}</p>
    }

    <ts-boton
      variante="primario"
      tipo="submit"
      [deshabilitado]="formularioInvalido()"
      [cargando]="enviando()"
      [etiquetaCargando]="'admin.iniciarSesion.enviando' | transloco"
    >
      {{ 'admin.iniciarSesion.entrar' | transloco }}
    </ts-boton>
  </form>
</section>
