<!-- En el teléfono, los controles apilados ocupaban la primera pantalla entera
     y el primer producto quedaba a 780 px de desplazamiento. Por debajo del
     primer punto de quiebre los filtros van plegados tras un *disclosure*
     (`aria-expanded` + `aria-controls`, el mismo patrón del menú móvil), y
     arrancan abiertos solo si la URL ya trae un filtro: un filtro aplicado que
     no se ve es peor que uno que hay que abrir. Desde `desde-movil:` el botón
     desaparece y el formulario se pinta siempre, como hasta ahora. -->
<div class="mx-auto max-w-contenido px-16 pb-16 desde-movil:hidden">
  <ts-boton
    variante="secundario"
    tipo="button"
    clase="w-full"
    [expandido]="abierto()"
    controla="filtros-productos"
    (click)="alternar()"
  >
    {{ (abierto() ? 'catalogo.filtros.ocultar' : 'catalogo.filtros.mostrar') | transloco }}
  </ts-boton>
</div>

<!-- Dos bandas, no una fila. La jerarquía es la misma de siempre —escribir qué
     se busca y acotar lo que ya salió son dos gestos distintos— pero antes se
     expresaba poniéndolos a los dos extremos de una misma línea, y eso solo se
     veía en escritorio: entre 640 y 1024 px la caja de búsqueda y los cuatro
     desplegables compartían una fila que se partía por donde le cabía, así que
     "Ordenar por" terminaba debajo de la búsqueda y "Limpiar" colgando solo.
     Ahora la búsqueda tiene su propia banda arriba y los filtros la suya
     debajo, y el corte entre las dos no depende de cuánto mida cada etiqueta.
     Ninguno lleva etiqueta a la vista: la búsqueda la sustituye por su ancla y
     su placeholder, y cada desplegable se explica con la opción que tiene
     elegida —"Todas las marcas" ya dice que es el filtro de marca—. Las
     etiquetas siguen ahí para quien navega con lector de pantalla. -->
<form
  id="filtros-productos"
  class="mx-auto max-w-contenido flex-col gap-16 px-16 pb-24 desde-movil:flex"
  [class.flex]="abierto()"
  [class.hidden]="!abierto()"
  [formGroup]="form"
  (submit)="$event.preventDefault()"
>
  <!-- Capada a `max-w-formulario-lg` y no a todo el ancho del contenido: una
       caja de texto de 1200 px invita a escribir una frase, y lo que se busca
       aquí son dos o tres palabras. -->
  <ts-campo
    class="w-full desde-tableta:max-w-formulario-lg"
    idCampo="filtro-texto"
    [label]="'catalogo.filtros.texto' | transloco"
    [placeholder]="'catalogo.filtros.texto_placeholder' | transloco"
    [icono]="iconoBuscar"
    [etiquetaOculta]="true"
    tipo="search"
    formControlName="texto"
  />

  <div class="flex flex-col gap-12 desde-tableta:flex-row desde-tableta:items-center">
    <!-- Rejilla y no `flex-wrap`: los cuatro desplegables tienen etiquetas de
         largos muy distintos —"Relevancia" contra "Todas las categorías"— y en
         `flex` cada uno se quedaba con el ancho de su texto, así que la fila se
         leía como cuatro controles desparejos. `grid-cols-4` reparte la banda en
         cuatro columnas iguales (`minmax(0, 1fr)`, que además es lo que impide
         que un `<select>` ensanche su columna hasta su opción más larga).
         `min-w-0` por lo mismo un nivel más arriba: desde tableta esta rejilla es un item de
         `flex`, y el `min-width: auto` de un item no lo deja encoger por debajo de su
         contenido. Es el mismo defecto que tenía `<main>` en `app.html`, donde se llevó por
         delante el ancho de la página entera. -->
    <div
      class="grid min-w-0 grid-cols-1 gap-12 desde-movil:grid-cols-2 desde-tableta:flex-1 desde-tableta:grid-cols-4"
    >
      <ts-select
        idCampo="filtro-linea"
        [label]="'catalogo.filtros.linea_label' | transloco"
        [placeholder]="'catalogo.filtros.todas_lineas' | transloco"
        [opciones]="opcionesLinea()"
        [etiquetaOculta]="true"
        formControlName="linea"
      />

      <ts-select
        idCampo="filtro-categoria"
        [label]="'catalogo.filtros.categoria' | transloco"
        [placeholder]="'catalogo.filtros.todas_categorias' | transloco"
        [opciones]="opcionesCategoria()"
        [etiquetaOculta]="true"
        formControlName="categoria"
      />

      <ts-select
        idCampo="filtro-marca"
        [label]="'catalogo.filtros.marca' | transloco"
        [placeholder]="'catalogo.filtros.todas_marcas' | transloco"
        [opciones]="opcionesMarca()"
        [etiquetaOculta]="true"
        formControlName="marca"
      />

      <!-- El único de los cuatro que no nombra un atributo del producto, y por eso el único con
           ancla: sin ella, "Relevancia" al lado de "Todas las marcas" se lee como una marca. -->
      <ts-select
        idCampo="filtro-orden"
        [label]="'catalogo.filtros.orden_label' | transloco"
        [opciones]="opcionesOrden()"
        [icono]="iconoOrden"
        [etiquetaOculta]="true"
        formControlName="orden"
      />
    </div>

    <!-- Fuera de la rejilla a propósito: no es un filtro más, es lo que los
         deshace. Dentro, ocupaba una quinta columna del mismo ancho que un
         desplegable y se leía como uno. -->
    <ts-boton variante="texto" tipo="button" (click)="limpiar()">
      {{ 'catalogo.filtros.limpiar' | transloco }}
    </ts-boton>
  </div>
</form>
