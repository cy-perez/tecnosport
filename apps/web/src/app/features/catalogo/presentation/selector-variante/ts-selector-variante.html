@for (eje of ejes(); track eje.nombre) {
  <fieldset class="m-0 mb-16 border-0 p-0">
    <legend class="mb-8 p-0 text-sm text-ts-texto-suave">{{ eje.nombre }}</legend>
    <div class="flex flex-wrap gap-8">
      @for (opcion of eje.opciones; track opcion.valor) {
        @if (esColor(opcion)) {
          <!-- El color va en un <span> interno y no en el <button>. El botón
               medía 32 x 32, que es el tamaño que el swatch debe *verse*; ahora
               el botón es el objetivo táctil de 44 y el span conserva los 32 con
               su borde. Separar las dos cosas es lo que permite cumplir el
               objetivo sin agrandar la muestra de color. -->
          <button
            type="button"
            [class]="claseSwatch()"
            [attr.aria-pressed]="estaSeleccionada(eje.nombre, opcion) ? 'true' : 'false'"
            [attr.aria-label]="opcion.valor"
            (click)="elegir(eje.nombre, opcion)"
          >
            <span
              [class]="claseMuestra(estaSeleccionada(eje.nombre, opcion))"
              [style.background-color]="opcion.colorHex"
            ></span>
          </button>
        } @else {
          <ts-boton
            [variante]="estaSeleccionada(eje.nombre, opcion) ? 'primario' : 'secundario'"
            [presionado]="estaSeleccionada(eje.nombre, opcion)"
            (click)="elegir(eje.nombre, opcion)"
          >
            {{ opcion.valor }}
          </ts-boton>
        }
      }
    </div>
  </fieldset>
}
