<div class="relative grid size-full place-items-center">
  @if (fantasma() !== null && mostrarFantasma()) {
    <!-- Debajo de las líneas y a baja opacidad: es una referencia, no la imagen. -->
    <img class="absolute inset-0 size-full object-cover opacity-35" [src]="fantasma()" alt="" />
  }

  <!--
    Marco 1:1, que es la proporción de salida. Lo que quede fuera no va a estar
    en el fotograma final, así que el marco es la promesa que el recorte tiene
    que cumplir.

    Sobre una vista de cámara el contraste no está garantizado
    (docs/10-captura-360.md): la línea clara lleva siempre una sombra oscura
    detrás, para que se vea igual sobre fondo blanco que sobre fondo negro. El
    ámbar de marca no se usa como línea fina sobre imagen.

    Eso lo decía este comentario y en tema oscuro pasaba lo contrario, porque
    `sobre-primario` y `primario` se intercambian entre temas: la línea salía
    casi negra y el halo, ámbar. `sobre-marca` es claro en los dos temas y
    `marca` oscuro en los dos, que es lo que el párrafo de arriba describe.
  -->
  <div
    class="relative aspect-square h-[min(100%,100vw)] max-w-full border border-ts-sobre-marca drop-shadow-[0_0_1px_var(--color-marca)]"
  >
    <span class="absolute bg-ts-sobre-marca opacity-60 w-px h-full left-1/3"></span>
    <span class="absolute bg-ts-sobre-marca opacity-60 w-px h-full left-2/3"></span>
    <span class="absolute bg-ts-sobre-marca opacity-60 h-px w-full top-1/3"></span>
    <span class="absolute bg-ts-sobre-marca opacity-60 h-px w-full top-2/3"></span>

    <!-- La marca de centro: el producto va centrado en todas las tomas, no solo
         dentro del marco. El SCSS le ponía `border-radius: var(--radio-completo)`
         esperando un círculo; el token valía 0 ("radio 0 en todo"), así que
         siempre fue un cuadrado, y se dejó cuadrado porque mandaba el sistema.
         **Desde el 24 de septiembre de 2026 ese token vale 9999 px**
         (`ADR-0060`), así que el círculo que se quiso ya se puede tener con
         `rounded-completo`. No se cambia aquí: el cambio entró por los dos
         alternadores del encabezado y esta pantalla se migra cuando se toque.
         Queda escrito para que nadie vuelva a leer el comentario de arriba y
         concluya que el sistema sigue prohibiendo la curva. -->
    <span
      class="absolute top-1/2 left-1/2 size-24 -translate-x-1/2 -translate-y-1/2 border border-ts-sobre-marca opacity-80"
    ></span>
  </div>
</div>
