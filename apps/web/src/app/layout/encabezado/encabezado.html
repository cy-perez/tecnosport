<header class="encabezado">
  <a
    class="encabezado__logo"
    [routerLink]="['/', idiomaActual()]"
    [attr.aria-label]="'encabezado.ir_a_portada' | transloco"
  >
    <span class="logo-par">
      <img
        class="logo-marca logo-pos"
        src="assets/marca/logo/logo-horizontal.svg"
        width="160"
        height="34"
        alt=""
      />
      <img
        class="logo-marca logo-neg"
        src="assets/marca/logo/logo-mono-negativo.svg"
        width="160"
        height="34"
        alt=""
      />
    </span>
  </a>

  <nav class="encabezado__nav" [attr.aria-label]="'encabezado.navegacion' | transloco">
    <a class="encabezado__enlace" [routerLink]="['/', idiomaActual(), 'productos']">
      {{ 'encabezado.catalogo' | transloco }}
    </a>
    @if (sesion.esAdmin()) {
      <a class="encabezado__enlace" [routerLink]="['/', idiomaActual(), 'admin']">
        {{ 'encabezado.panel' | transloco }}
      </a>
    }
  </nav>

  <div class="encabezado__controles">
    @if (sesion.sesion()) {
      <button class="encabezado__enlace encabezado__boton" type="button" (click)="cerrarSesion()">
        {{ 'encabezado.cerrar_sesion' | transloco }}
      </button>
    } @else {
      <a class="encabezado__enlace" [routerLink]="['/', idiomaActual(), 'cuenta', 'iniciar-sesion']">
        {{ 'encabezado.entrar' | transloco }}
      </a>
      <a class="encabezado__enlace" [routerLink]="['/', idiomaActual(), 'cuenta', 'registro']">
        {{ 'encabezado.crear_cuenta' | transloco }}
      </a>
    }

    <a
      class="encabezado__carrito"
      [routerLink]="['/', idiomaActual(), 'carrito']"
      [attr.aria-label]="'encabezado.carrito_cantidad' | transloco: { cantidad: carrito.cantidadTotal() }"
    >
      <!-- Iconografía propia: el kit de marca solo trae logos (docs/04-ui-marca.md).
           24x24, trazo 1.5, currentColor — sin librería de iconos. -->
      <svg
        class="encabezado__icono"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M2.5 3.5h2.2l2.4 10.6a1.8 1.8 0 0 0 1.8 1.4h7.6a1.8 1.8 0 0 0 1.8-1.4L21.5 7H5.6" />
        <circle cx="10" cy="20" r="1.4" />
        <circle cx="17" cy="20" r="1.4" />
      </svg>
      @if (carrito.cantidadTotal() > 0) {
        <span class="encabezado__carrito-cantidad" aria-hidden="true">{{ carrito.cantidadTotal() }}</span>
      }
    </a>

    <label class="encabezado__control">
      <span>{{ 'idioma.etiqueta' | transloco }}</span>
      <select [value]="idiomaActual()" (change)="cambiarIdioma($any($event.target).value)">
        @for (idioma of idiomas; track idioma) {
          <option [value]="idioma">{{ idioma.toUpperCase() }}</option>
        }
      </select>
    </label>

    <label class="encabezado__control">
      <span>{{ 'tema.etiqueta' | transloco }}</span>
      <select [value]="temaElegido()" (change)="cambiarTema($any($event.target).value)">
        <option value="claro">{{ 'tema.claro' | transloco }}</option>
        <option value="oscuro">{{ 'tema.oscuro' | transloco }}</option>
        <option value="sistema">{{ 'tema.sistema' | transloco }}</option>
      </select>
    </label>
  </div>
</header>
