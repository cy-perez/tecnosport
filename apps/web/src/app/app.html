<!-- `-translate-y-[200%]` lo saca de la vista sin quitarlo del orden de
     tabulación, que es el punto: el primer Tab de la página lo trae de vuelta
     con `focus-visible:translate-y-0`. `anillo-foco-sobre-acento` y no
     `anillo-foco`: el enlace es ámbar, y en tema oscuro `--color-foco` también
     es ámbar (src/tailwind.css). -->
<a
  class="anillo-foco-sobre-acento chaflan absolute top-8 left-8 z-10 inline-flex min-h-tactil -translate-y-[200%] items-center bg-ts-acento px-16 py-8 text-sm text-ts-sobre-acento no-underline focus-visible:translate-y-0"
  href="#contenido"
  >{{ 'app.saltar_al_contenido' | transloco }}</a
>
<app-encabezado />
<!-- `outline-none` es aquí la excepción documentada a "el anillo de foco no se
     elimina jamás": este landmark recibe foco **por programa** desde el enlace
     de salto, no entra en el orden de tabulación (`tabindex="-1"`), y dibujarle
     un anillo sería anunciar un foco que nadie pidió. -->
<!-- `min-w-0` no es decorativo: `<main>` es un item del grid de `app-root`, y
     el `min-width: auto` que trae por omisión un item de grid le impide encogerse
     por debajo de su ancho de min-content. En el catálogo a 380 px eso reventaba
     la página entera: la rejilla de filtros —`repeat(auto-fill, minmax(160px,
     1fr))`— resolvía **seis** columnas de 160 px en vez de envolver a una, y el
     documento se iba a 1104 px con desplazamiento horizontal en todo el sitio,
     encabezado y pie incluidos, porque todo se estira al ancho del documento.
     Medido: `<main>` 1104 px con `app-root` en 363. Con `min-w-0`, 363 y una
     sola columna. Ninguna prueba lo veía —jsdom no hace layout— y en escritorio
     no se nota, porque ahí sí caben las seis columnas. -->
<main id="contenido" class="min-w-0 focus:outline-none" tabindex="-1">
  <router-outlet />
</main>
<app-pie />
