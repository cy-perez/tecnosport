<header class="portada__header">
  <span class="logo-par">
    <img
      class="logo-marca logo-pos"
      src="assets/marca/logo/logo-horizontal.svg"
      width="160"
      height="34"
      alt="Tecno Sport"
    />
    <img
      class="logo-marca logo-neg"
      src="assets/marca/logo/logo-mono-negativo.svg"
      width="160"
      height="34"
      alt="Tecno Sport"
    />
  </span>

  <div class="portada__controles">
    <label class="portada__control">
      <span>{{ 'idioma.etiqueta' | transloco }}</span>
      <select
        [value]="idiomaActual()"
        (change)="cambiarIdioma($any($event.target).value)"
      >
        @for (idioma of idiomas; track idioma) {
          <option [value]="idioma">{{ idioma.toUpperCase() }}</option>
        }
      </select>
    </label>

    <label class="portada__control">
      <span>{{ 'tema.etiqueta' | transloco }}</span>
      <select
        [value]="temaElegido()"
        (change)="cambiarTema($any($event.target).value)"
      >
        <option value="claro">{{ 'tema.claro' | transloco }}</option>
        <option value="oscuro">{{ 'tema.oscuro' | transloco }}</option>
        <option value="sistema">{{ 'tema.sistema' | transloco }}</option>
      </select>
    </label>
  </div>
</header>

<main class="portada">
  <h1>{{ 'app.titulo' | transloco }}</h1>
  <p>{{ 'portada.bienvenida' | transloco }}</p>
  <button type="button" class="chaflan">{{ 'portada.boton_demo' | transloco }}</button>
</main>

<router-outlet />
