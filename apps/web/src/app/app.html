<!-- `-translate-y-[200%]` lo saca de la vista sin quitarlo del orden de
     tabulación, que es el punto: el primer Tab de la página lo trae de vuelta
     con `focus-visible:translate-y-0`. `anillo-foco-dentro-acento` y no
     `anillo-foco`: el enlace es ámbar, y en tema oscuro `--color-foco` también
     es ámbar (src/tailwind.css). **Dentro** y no `sobre-acento`, que lo pintaba
     fuera: el enlace aparece encima del encabezado, y un anillo grafito sobre la
     barra oscura no se veía. Por dentro tiene ámbar a los dos lados.

     `z-superior` y no `z-pegada`, y es consecuencia directa del encabezado fijo: desde que
     `app-encabezado` es `sticky z-encabezado`, este enlace —que se pinta justo encima de la barra, en `top-8 left-8`—
     quedaba **detrás** de ella al recibir el foco. Un enlace de salto invisible es un enlace de
     salto que no existe. Va al mismo nivel que el diálogo porque no compite con él: solo se ve
     enfocado, y un diálogo abierto atrapa el foco. -->
<a
  class="anillo-foco-dentro-acento chaflan absolute top-8 left-8 z-superior inline-flex min-h-tactil -translate-y-[200%] items-center bg-ts-acento px-16 py-8 text-sm text-ts-sobre-acento no-underline focus-visible:translate-y-0"
  href="#contenido"
  >{{ 'app.saltar_al_contenido' | transloco }}</a
>
<!-- Antes que el encabezado en el orden del documento, y es deliberado: es el landmark de
     navegación principal del sitio, así que quien recorre la página con lector de pantalla lo
     encuentra donde lo espera. Visualmente no importa el orden —es `fixed`—. -->
<app-menu-lateral />
<app-encabezado />
<!-- `outline-none` es aquí la excepción documentada a "el anillo de foco no se
     elimina jamás": este landmark recibe foco **por programa** desde el enlace
     de salto, no entra en el orden de tabulación (`tabindex="-1"`), y dibujarle
     un anillo sería anunciar un foco que nadie pidió. -->
<!-- `min-w-0` no es decorativo: `<main>` es un item del grid de `app-root`, y
     el `min-width: auto` que trae por omisión un item de grid le impide encogerse
     por debajo de su ancho de min-content. En el catálogo a 380 px eso reventaba
     la página entera: la rejilla de filtros —`repeat(auto-fill, minmax(160px,
     1fr))`— resolvía **seis** columnas de 160 px en vez de envolver a una, y el
     documento se iba a 1104 px con desplazamiento horizontal en todo el sitio,
     encabezado y pie incluidos, porque todo se estira al ancho del documento.
     Medido: `<main>` 1104 px con `app-root` en 363. Con `min-w-0`, 363 y una
     sola columna. Ninguna prueba lo veía —jsdom no hace layout— y en escritorio
     no se nota, porque ahí sí caben las seis columnas. -->
<!-- Sin `scroll-mt-*` desde el 4 de octubre de 2026: el alto del encabezado fijo lo descuenta el
     `scroll-padding-top` de `html` (`src/tailwind.css`), que vale para el enlace de salto y para
     cualquier cosa que reciba el foco. Con los dos a la vez, el salto se pasaría el doble. -->
<main id="contenido" class="min-w-0 focus:outline-none" tabindex="-1">
  <router-outlet />
</main>
<!-- El pie se hidrata con el resto de la página, **sin `@defer`**, y es a propósito.

     Estuvo detrás de `@defer (on immediate; hydrate on viewport)` para ahorrar evaluación de
     scripts, confiando en que el replay de eventos no pierde un clic temprano. Sí lo pierde si el
     clic llega **mientras** se hidrata: la hidratación por `viewport` no pasa función de replay
     (`triggerHydrationFromBlockName` en `@angular/core` 22.1.4, igual en 22.2.1), y la del clic
     encuentra el bloque "ya hidratándose" y sale sin reproducir la cola. Un enlace del pie pulsado
     justo al aparecer no hacía nada: 3 de cada 100 en el build de producción, y la causa de los
     fallos intermitentes de `e2e/navegacion-legal.spec.ts` (5 de oct. de 2026).
     `hydrate on interaction` no pierde el clic, pero un bloque sin hidratar no se actualiza: con el
     pie a la vista, cambiar de idioma lo dejaba en el anterior. -->
<app-pie />
<!-- Después del pie, a propósito: ver el javadoc del
     componente. Aquí abajo es el último objetivo de tabulación de la página; arriba se llevaría
     el primer Tab de todas. -->
<app-boton-whatsapp />
