<div class="ts-select">
  <label class="ts-select__label" [for]="idCampo()">{{ label() }}</label>
  <select
    class="ts-select__control"
    [id]="idCampo()"
    [disabled]="deshabilitado()"
    [value]="valor()"
    (change)="manejarCambio($any($event.target).value)"
  >
    @if (placeholder()) {
      <option value="">{{ placeholder() }}</option>
    }
    @for (opcion of opciones(); track opcion.valor) {
      <option [value]="opcion.valor">{{ opcion.etiqueta }}</option>
    }
  </select>
</div>
