<a class="ts-tarjeta-producto chaflan" [routerLink]="enlace()">
  @if (producto().imagenPrincipal; as imagen) {
    <!-- `fill`, no `width`/`height`: la tarjeta recorta a un cuadrado con
         `object-fit: cover`, así que la relación de aspecto pintada nunca
         coincide con la del archivo y NgOptimizedImage avisaba (NG02952) con
         razón. `fill` es el modo que Angular documenta para una imagen cuyo
         tamaño lo decide el CSS: el marco reserva el espacio —sin salto de
         diseño al cargar— y el recorte pasa a ser lo declarado, en vez de una
         contradicción entre el atributo y la hoja de estilos. -->
    <div class="ts-tarjeta-producto__marco">
      <img class="ts-tarjeta-producto__imagen" [ngSrc]="url(imagen)" [alt]="alt()" [priority]="prioritaria()" fill />
    </div>
  }
  <div class="ts-tarjeta-producto__cuerpo">
    <p class="ts-tarjeta-producto__marca">{{ producto().marca.nombre }}</p>
    <h3 class="ts-tarjeta-producto__nombre">{{ producto().nombre }}</h3>
    <div class="ts-tarjeta-producto__pie">
      @if (precio(); as precioValor) {
        <ts-precio [valor]="precioValor.valor" [moneda]="precioValor.moneda" [desde]="true" />
      }
      <ts-etiqueta-stock [disponible]="disponible()" />
    </div>
  </div>
</a>
