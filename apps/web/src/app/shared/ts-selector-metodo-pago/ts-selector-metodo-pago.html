<fieldset class="ts-selector-metodo-pago">
  <legend class="ts-selector-metodo-pago__titulo">{{ etiquetaGrupo() }}</legend>
  <div class="ts-selector-metodo-pago__opciones">
    @for (opcion of opciones(); track opcion.valor) {
      <ts-boton
        [variante]="estaSeleccionado(opcion) ? 'primario' : 'secundario'"
        [presionado]="estaSeleccionado(opcion)"
        (click)="elegir(opcion)"
      >
        {{ opcion.etiqueta }}
      </ts-boton>
    }
  </div>
</fieldset>
