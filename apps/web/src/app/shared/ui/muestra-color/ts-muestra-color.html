<svg
  class="block size-full"
  viewBox="0 0 100 100"
  preserveAspectRatio="none"
  aria-hidden="true"
  focusable="false"
>
  <defs>
    @for (porcion of porciones(); track $index) {
      @if (porcion.patron; as patron) {
        @switch (patron.tipo) {
          @case ('MULTICOLOR') {
            <!-- Franjas diagonales: una por color, a lo ancho del lienzo. -->
            <pattern
              [attr.id]="patron.id"
              patternUnits="userSpaceOnUse"
              width="100"
              height="100"
              patternTransform="rotate(45 50 50)"
            >
              @for (franja of franjas(patron.colores); track $index) {
                <rect
                  [attr.x]="franja.x"
                  y="-50"
                  [attr.width]="franja.ancho"
                  height="200"
                  [attr.fill]="franja.color"
                />
              }
            </pattern>
          }
          @case ('ESTAMPADO') {
            <!-- Puntos del segundo color sobre el primero, en tresbolillo. -->
            <pattern [attr.id]="patron.id" patternUnits="userSpaceOnUse" width="20" height="20">
              <rect width="20" height="20" [attr.fill]="patron.colores[0]" />
              <circle cx="5" cy="5" r="3" [attr.fill]="patron.colores[1]" />
              <circle cx="15" cy="15" r="3" [attr.fill]="patron.colores[1]" />
            </pattern>
          }
          @case ('ANIMAL_PRINT') {
            <!-- Manchas irregulares del segundo color sobre el primero, tipo leopardo. -->
            <pattern [attr.id]="patron.id" patternUnits="userSpaceOnUse" width="40" height="40">
              <rect width="40" height="40" [attr.fill]="patron.colores[0]" />
              <ellipse
                cx="9"
                cy="10"
                rx="6"
                ry="4"
                transform="rotate(-20 9 10)"
                [attr.fill]="patron.colores[1]"
              />
              <ellipse
                cx="28"
                cy="8"
                rx="4"
                ry="5"
                transform="rotate(30 28 8)"
                [attr.fill]="patron.colores[1]"
              />
              <ellipse
                cx="20"
                cy="26"
                rx="7"
                ry="4"
                transform="rotate(15 20 26)"
                [attr.fill]="patron.colores[1]"
              />
              <ellipse
                cx="6"
                cy="33"
                rx="4"
                ry="3"
                transform="rotate(-35 6 33)"
                [attr.fill]="patron.colores[1]"
              />
              <ellipse
                cx="35"
                cy="31"
                rx="3"
                ry="5"
                transform="rotate(10 35 31)"
                [attr.fill]="patron.colores[1]"
              />
            </pattern>
          }
        }
      }
    }
  </defs>
  @for (porcion of porciones(); track $index) {
    <path [attr.d]="porcion.trazo" [attr.fill]="porcion.relleno" />
  }
</svg>
