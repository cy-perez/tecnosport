@if (hayRotacion()) {
  <div class="flex flex-col gap-8">
    <!-- El marco es el que recibe el foco y los gestos: es lo que se ve girar. `role="group"` con
         su nombre accesible, porque no es una imagen suelta sino un control con varias piezas, y
         `aria-describedby` apuntando a las instrucciones: sin eso, quien usa un lector de pantalla
         enfoca el visor y no se entera de que las flechas giran. -->
    <div
      #marco
      class="anillo-foco superficie-arrastre relative aspect-square bg-ts-superficie-alt"
      [class.cursor-grabbing]="arrastrando()"
      [class.cursor-grab]="!arrastrando()"
      tabindex="0"
      role="group"
      [attr.aria-label]="'visor360.etiqueta' | transloco"
      [attr.aria-describedby]="idInstrucciones"
      (keydown)="alTeclado($event)"
      (pointerdown)="iniciarArrastre($event)"
      (pointermove)="mover($event)"
      (pointerup)="terminarArrastre($event)"
      (pointercancel)="terminarArrastre($event)"
    >
      <!-- Un solo <img> que cambia de `ngSrc`: es la vía que NgOptimizedImage soporta en caliente
           (las demás entradas sí están congeladas tras la inicialización). El fotograma 0 es el que
           sirve el SSR y la candidata a LCP de la ficha, de ahí `priority`. Modo `fill` porque el
           recorte cuadrado lo decide el CSS. `alt=""`: los fotogramas son decorativos en conjunto,
           la descripción del producto vive en el texto de la ficha. -->
      @if (urlVisible()) {
        <img class="pointer-events-none object-cover" [ngSrc]="urlVisible()" alt="" fill priority />
      }

      @if (pistaVisible()) {
        <p class="absolute bottom-12 left-1/2 m-0 -translate-x-1/2 whitespace-nowrap bg-ts-marca px-12 py-4 text-sm text-ts-sobre-marca" aria-hidden="true">{{ 'visor360.pista' | transloco }}</p>
      }
    </div>

    <div class="flex items-center justify-center gap-16">
      <ts-boton variante="secundario" [etiquetaAccesible]="'visor360.girar_izquierda' | transloco" (click)="girar(-1)">
        ‹
      </ts-boton>

      <!-- `aria-live` por el mismo motivo que en ts-paginador: al girar con el teclado el foco se
           queda donde estaba y nada más anunciaría el cambio. -->
      <span class="min-w-[12ch] text-center text-sm text-ts-texto-suave" aria-live="polite">
        {{ 'visor360.posicion' | transloco: { actual: indiceActual() + 1, total: total() } }}
      </span>

      <ts-boton variante="secundario" [etiquetaAccesible]="'visor360.girar_derecha' | transloco" (click)="girar(1)">
        ›
      </ts-boton>
    </div>

    <p class="m-0 text-center text-sm text-ts-texto-suave" [id]="idInstrucciones">{{ 'visor360.instrucciones' | transloco }}</p>
  </div>
}
