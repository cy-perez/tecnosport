<!-- `role="group"` y no `<nav>`: sí lleva a otra URL, pero dentro sólo hay un
     control —el activo es un `<span>`— y un landmark de navegación más en el
     encabezado, al lado del que ya existe, es ruido para quien los recorre.
     El nombre del grupo sí hace falta: "ES" y "EN" no dicen de qué son.

     La forma es la del control segmentado de la plantilla de referencia: una
     pista de fondo suave con una pastilla encima marcando el activo, sin borde
     y sin divisor entre los segmentos. Hasta el 24 de septiembre de 2026 era
     una caja de esquinas vivas con borde y un `border-l` de separador, porque
     el sistema declaraba "radio 0 en todo"; ese día el chaflán se reservó a la
     marca y la interfaz pasó a redondear (`ADR-0060`).

     **Lo único que no se copió de la referencia es el relleno de 2 px** que
     deja la pastilla flotando dentro de la pista. Allá la pista mide 40 px y
     los segmentos 36; aquí ese relleno saldría de los segmentos o empujaría el
     grupo hacia arriba y lo descuadraría con el botón circular del tema, que va
     justo al lado. Con relleno 0 y el mismo radio en pista y pastilla, las
     esquinas encajan sin dejar un filo de pista a la vista.

     **`compacto` y no `tactil`: 35 px, no 44.** Se pidió el 28 de septiembre de
     2026 y lo comparten los dos alternadores de la barra, que es donde empieza
     y acaba la excepción. El porqué y qué norma se toca están en
     `ts-alternador-tema`, junto al `tamano()` que hace lo mismo allí — en corto:
     el mínimo de WCAG 2.2 AA (2.5.8) es 24×24 y 35 lo pasa con margen; los 44
     son AAA y la tabla de medidas del proyecto.

     `items-stretch` para que cada segmento llene el alto de la pista sin
     repetir la medida. -->
<div
  class="inline-flex h-compacto items-stretch rounded-md bg-ts-superficie-alt text-sm oscuro:bg-ts-fondo"
  role="group"
  [attr.aria-label]="etiquetaDelGrupo()"
>
  @for (idioma of idiomas; track idioma) {
    <!-- `box-border` en los dos y no solo en uno: un `<button>` ya viene con
         `box-sizing: border-box` del navegador y un `<span>` no, así que sin
         esto el `px-8` se le sumaba al `min-w-compacto` del activo y el
         segmento medía 16 px de más que el otro. Medido en el navegador
         cuando la medida eran 44: salían 60 contra 44.
         El preflight de este proyecto no resetea `box-sizing`. -->
    <!-- El código en mayúscula se lee igual en los dos idiomas: no se traduce.
         Quien sí se traduce es el `aria-label` del botón, porque "EN" no dice
         a dónde lleva. El activo no lo necesita: `aria-current` ya lo explica,
         y ahí el texto visible sí es el nombre accesible. -->
    @if (idioma === idiomaActivo()) {
      <!-- La pastilla del activo tiene que **subir** sobre la pista, y cuál de
           las dos superficies está arriba cambia con el tema: en claro la que
           brilla es `superficie` (blanco) sobre `superficie-alt` (gris); en
           oscuro el orden se invierte —`fondo` 0E1217 < `superficie` 191E26 <
           `superficie-alt` 242A34— y con el mismo par la pastilla quedaba más
           oscura que la pista: el activo se leía hundido y el inactivo
           seleccionado. Se vio en el navegador, no en una prueba. De ahí los
           dos `oscuro:`, que es justo para lo que existe el variant. La pista
           baja a `fondo` y no se queda en `superficie`, que es el color del
           encabezado y la dejaría invisible. -->
      <span
        class="box-border inline-flex min-w-compacto items-center justify-center rounded-md bg-ts-superficie px-8 font-medio text-ts-texto shadow-sm oscuro:bg-ts-superficie-alt"
        aria-current="true"
        >{{ idioma.toUpperCase() }}</span
      >
    } @else {
      <!-- El inactivo no pinta fondo: la pista ya es `superficie-alt`, así que
           el `hover:bg-ts-superficie-alt` que tenía la versión con borde aquí
           no haría nada. El hover se ve en el color del texto. -->
      <button
        class="anillo-foco box-border inline-flex min-w-compacto cursor-pointer items-center justify-center rounded-md bg-transparent px-8 font-texto text-sm text-ts-texto-suave transition-colors hover:text-ts-texto"
        type="button"
        [attr.aria-label]="accion(idioma)"
        (click)="navegarA(idioma)"
      >
        {{ idioma.toUpperCase() }}
      </button>
    }
  }
</div>
