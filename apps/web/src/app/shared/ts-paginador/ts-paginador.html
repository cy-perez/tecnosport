<nav class="mt-24 flex items-center gap-16" [attr.aria-label]="'paginador.navegacion' | transloco">
  <!-- `inactivo` (aria-disabled) y no `deshabilitado`: al llegar a la última página con
       «Siguiente», el botón pulsado se deshabilitaba bajo el dedo y el foco caía en `<body>`.
       `irA()` ignora el clic que no lleva a ninguna parte. -->
  <ts-boton variante="secundario" [inactivo]="!hayAnterior()" (click)="irA(pagina() - 1)">
    {{ 'paginador.anterior' | transloco }}
  </ts-boton>

  <!-- `aria-live` para que un lector de pantalla anuncie la página nueva: al
       cambiar de página el foco se queda en el botón, que no cambia de texto. -->
  <span class="text-sm text-ts-texto-suave" aria-live="polite">
    {{ 'paginador.info' | transloco: { actual: pagina() + 1, total: total() } }}
  </span>

  <ts-boton variante="secundario" [inactivo]="!haySiguiente()" (click)="irA(pagina() + 1)">
    {{ 'paginador.siguiente' | transloco }}
  </ts-boton>
</nav>
