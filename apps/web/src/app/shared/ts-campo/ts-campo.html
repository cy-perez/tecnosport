<div class="ts-campo">
  <label class="ts-campo__label" [for]="idCampo()">{{ label() }}</label>
  <input
    class="ts-campo__control"
    [id]="idCampo()"
    [type]="tipo()"
    [value]="valorMostrado()"
    [disabled]="deshabilitado()"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="error() ? idCampo() + '-error' : null"
    (input)="manejarEntrada($any($event.target).value)"
    (blur)="manejarSalida()"
  />
  @if (error()) {
    <p class="ts-campo__error" [id]="idCampo() + '-error'" role="alert">{{ error() }}</p>
  }
</div>
