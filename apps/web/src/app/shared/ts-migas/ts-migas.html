<nav class="ts-migas" [attr.aria-label]="'migas.navegacion' | transloco">
  <ol class="ts-migas__lista">
    @for (miga of ruta(); track miga.etiqueta; let ultimo = $last) {
      <li class="ts-migas__item">
        @if (miga.enlace) {
          <a class="ts-migas__enlace" [routerLink]="miga.enlace">{{ miga.etiqueta }}</a>
        } @else {
          <span class="ts-migas__actual" aria-current="page">{{ miga.etiqueta }}</span>
        }

        <!-- El separador va en la plantilla, no en un `content:` de CSS: sería
             texto visible fuera de Transloco. `aria-hidden` porque no aporta
             nada leído en voz alta, la lista ya da la estructura. -->
        @if (!ultimo) {
          <span class="ts-migas__separador" aria-hidden="true">/</span>
        }
      </li>
    }
  </ol>
</nav>
