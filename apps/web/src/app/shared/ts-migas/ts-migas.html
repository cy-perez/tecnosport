<nav [attr.aria-label]="'migas.navegacion' | transloco">
  <ol class="m-0 flex list-none flex-wrap items-center gap-8 p-0 text-sm">
    @for (miga of ruta(); track miga.etiqueta; let ultimo = $last) {
      <li class="inline-flex items-center gap-8">
        @if (miga.enlace) {
          <!-- Objetivo táctil: las migas son navegación (nav > ol > li), no una
               frase, así que no les aplica la excepción "inline" de WCAG 2.5.8
               —esa es para el enlace cuyo tamaño lo fija el interlineado del
               texto que lo rodea, como los de la dirección del pie. -->
          <a
            class="anillo-foco inline-flex min-h-tactil min-w-tactil items-center text-ts-texto-suave no-underline hover:underline"
            [routerLink]="miga.enlace"
            >{{ miga.etiqueta }}</a
          >
        } @else {
          <span class="font-medio text-ts-texto" aria-current="page">{{ miga.etiqueta }}</span>
        }

        <!-- El separador va en la plantilla, no en un `content:` de CSS: sería
             texto visible fuera de Transloco. `aria-hidden` porque no aporta
             nada leído en voz alta, la lista ya da la estructura. -->
        @if (!ultimo) {
          <span class="text-ts-texto-suave" aria-hidden="true">/</span>
        }
      </li>
    }
  </ol>
</nav>
