<!-- Redondo, como el botón de referencia. Fue cuadrado hasta el 24 de
     septiembre de 2026, cuando el sistema declaraba "radio 0 en todo": ese día
     el chaflán se reservó a la marca y la interfaz pasó a redondear
     (`ADR-0060`). `rounded-completo` son los 9999 px de `--radio-completo`, que
     en una caja cuadrada es exactamente un círculo — el radio se detiene solo
     en la mitad del lado, así que vale igual a 35 que a 44 y no hay nada que
     calcular.
     El lado lo decide `tamano()`: `size-compacto` (35 px) en el chip del
     encabezado y `size-tactil` (44) en el icono desnudo del pie.

     El nombre del botón es fijo y dice la acción, no el destino. La tentación
     era nombrarlo "Activar modo oscuro" y voltearlo con el tema, pero el
     destino solo se sabe leyendo `data-tema`, y el servidor no lo tiene
     mientras renderiza: `conTemaAplicado` lo inyecta por reemplazo de cadena
     sobre el HTML ya construido. Un nombre atado al tema saldría mintiendo del
     servidor hasta hidratar. "Cambiar el tema" es cierto en los dos estados.
     El destino lo dice el icono, que sí se puede resolver sin JavaScript. -->
<button [class]="clases()" type="button" [attr.aria-label]="etiqueta()" (click)="alternar()">
  <!-- Los dos iconos siempre en el DOM y el CSS tapa uno, colgado del mismo
       `data-tema` que ya está puesto en `<html>`. Es el patrón que el
       encabezado ya usa para el logo positivo y el negativo, y aquí evita el
       parpadeo que tendría un icono atado a una señal. Se ve la luna cuando el
       clic lleva a oscuro, y el sol cuando lleva a claro. `ts-icono` va con
       `aria-hidden`, así que ninguno de los dos toca el nombre del botón. -->
  <!-- **`flex` en el host, y no es adorno: sin él el icono no está centrado.**
       El host de `ts-icono` es `display: inline` por omisión, así que su caja no
       es el SVG: es una línea de texto con el SVG —que es `inline-block`—
       apoyado en la línea base y el hueco del descendente debajo. Centrar esa
       caja en el botón deja el dibujo un par de píxeles por encima del centro
       real del círculo, que es lo que se veía como un icono "desenfocado".
       Con `flex` la caja del host es exactamente el SVG y el centrado del
       botón funciona. Medido en el navegador: en jsdom no hay caja de línea
       que medir. -->
  <ts-icono class="flex oscuro:hidden" [icono]="iconoTemaOscuro" [clase]="claseIcono()" />
  <ts-icono class="hidden oscuro:flex" [icono]="iconoTemaClaro" [clase]="claseIcono()" />
</button>
