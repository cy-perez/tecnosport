<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Tecno Sport</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0E1217" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Quien ya eligió tema trae cookie, y esa la resuelve el servidor
      // (server.ts): el HTML llega con `data-tema` puesto y aquí no se toca.
      // Quien llega por primera vez no tiene cookie y hay que decidirle un
      // tema: manda el del sistema operativo, resuelto aquí antes del primer
      // pintado para no parpadear. Es un valor inicial, no una preferencia
      // guardada — en cuanto toque el botón, manda la cookie.
      (function () {
        if (!document.documentElement.getAttribute('data-tema')) {
          var oscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-tema', oscuro ? 'oscuro' : 'claro');
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <!-- Los dos idiomas a la vez, cada uno con su `lang`: este archivo es el mismo para `/es` y
         `/en`, y sin JavaScript no hay Transloco que elija. Estaba solo en español. -->
    <noscript>
      <p lang="es">Activa JavaScript para usar Tecno Sport.</p>
      <p lang="en">Turn on JavaScript to use Tecno Sport.</p>
    </noscript>
  </body>
</html>
