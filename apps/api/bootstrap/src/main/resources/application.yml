server:
  # PORT y no un número fijo: Cloud Run inyecta el puerto en esa variable y espera que el proceso
  # escuche exactamente ahí. En local no está definida y cae a 8080, que es lo de siempre.
  port: ${PORT:8080}

spring:
  application:
    name: tecnosport-api
  datasource:
    # DB_PARAMS al final y vacío por omisión: en local no hace falta nada, pero un Postgres
    # gestionado exige TLS (Neon rechaza la conexión sin `?sslmode=require`) y la plantilla no
    # tenía dónde ponerlo. Encontrado al montar el ambiente desplegado, antes de que costara un
    # despliegue que no arranca.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PUERTO:5432}/${DB_NOMBRE:tecnosport}${DB_PARAMS:}
    username: ${DB_USUARIO:tecnosport}
    password: ${DB_CLAVE:tecnosport}
    hikari:
      data-source-properties:
        # Sin esto, el mensaje de una violación de restricción trae la fila —"Key (correo)=(...)
        # already exists"— y termina en los registros. Propiedad de pgjdbc, comprobada en el
        # 42.7.11 que usa el proyecto.
        logServerErrorDetail: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        # Boot 4.1 trae un solo hilo para todas las tareas @Scheduled (lo dice su metadata, valor
        # por omisión 1): una que se colgara —un tercero sin responder— detenía a las demás. Con
        # varios hilos, una tarea lenta deja de bloquear la conciliación de pagos.
        size: ${PLANIFICADOR_HILOS:4}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    # Mailpit en local (docker-compose.yml), SMTP real en producción
    # (docs/07-infra-gcp.md). SMTP_PUERTO no estaba en la lista original de
    # variables del documento — Mailpit usa 1025, no el 587/465 típico de un
    # SMTP real, así que hacía falta poder cambiarlo por entorno igual que
    # DB_PUERTO ya existe junto a DB_HOST. SMTP_AUTH tampoco estaba: Mailpit no
    # exige autenticación, y `auth: true` a secas con usuario/clave vacíos
    # rompe en seco (`jakarta.mail.AuthenticationFailedException: failed to
    # connect, no password specified?`, encontrado en local contra bootRun
    # real) — producción sí lo activa por variable de entorno.
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PUERTO:1025}
    username: ${SMTP_USUARIO:}
    password: ${SMTP_CLAVE:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: true
          # Jakarta Mail espera sin límite por omisión. Las tareas programadas comparten hilos, y un
          # servidor SMTP que dejara colgada una conexión detenía también, sin un solo error, la
          # conciliación de pagos y de envíos. En milisegundos.
          connectiontimeout: ${SMTP_TIMEOUT_CONEXION_MS:10000}
          timeout: ${SMTP_TIMEOUT_LECTURA_MS:10000}
          writetimeout: ${SMTP_TIMEOUT_ESCRITURA_MS:10000}

tecnosport:
  siembra:
    # El catálogo de ejemplo de SembradorCatalogo, solo en los perfiles local y dev y solo con esto
    # en true. Apagado por omisión: vaciar el catálogo no puede devolver los productos de ejemplo
    # en el siguiente arranque. Lo encienden el flujo E2E y quien lo pida en `.env.local`.
    catalogo: ${SIEMBRA_CATALOGO:false}
  app:
    # La raiz del sitio, con la que el backend arma los enlaces que manda por correo. Misma
    # variable de entorno de siempre: lo que cambio es de quien cuelga, no como se configura.
    url-publica: ${APP_URL_PUBLICA:http://localhost:4200}
  correo:
    # Dato de negocio real, no inventado (regla dura #5): dominio real del proyecto.
    remitente: ${CORREO_REMITENTE:no-responder@tecnosport.co}
    bandeja:
      # La bandeja de salida (adr/0045). Un minuto, que es lo mas corto razonable: lo que separa
      # esto de un envio sincrono es exactamente esta espera, y quien acaba de registrarse esta
      # mirando su bandeja de entrada. Mas corto no aporta —la tarea arranca de todas formas— y
      # mas largo se nota.
      intervalo-minutos: ${CORREO_BANDEJA_INTERVALO_MINUTOS:1}
      # Cero y no "menor que el intervalo" como las otras tareas: aqui el arranque es justo cuando
      # mas urge, porque si el servicio venia caido hay correos esperando desde antes.
      retraso-inicial-minutos: ${CORREO_BANDEJA_RETRASO_INICIAL_MINUTOS:0}
      # Dato con consecuencia legal, no un ajuste: el cuerpo de un correo lleva el nombre de quien
      # compro, su pedido y a veces su direccion (docs/08-seguridad-legal.md). Treinta dias, el
      # mismo criterio que la purga de carritos.
      dias-retencion: ${CORREO_BANDEJA_DIAS_RETENCION:30}
      # Cuantos se intentan por vuelta. Con el intervalo en un minuto, cien por vuelta son seis mil
      # por hora: de sobra para cualquier pico que este negocio pueda producir, y acotado para que
      # una vuelta no se quede una hora hablando con un SMTP lento.
      tamano-del-lote: ${CORREO_BANDEJA_TAMANO_LOTE:100}
  pedido:
    minutos-reserva-inventario: ${MINUTOS_RESERVA_INVENTARIO:30}
    horas-vencimiento-transferencia: ${TRANSFERENCIA_HORAS_VENCIMIENTO:24}
    vigilancia-plazo:
      # El plazo vigilado es de 30 dias calendario (Ley 1480 de 2011, art. 18), asi que medio dia de
      # retraso en detectarlo no le cuesta nada a nadie. No es un dato de negocio: el 30 vive en
      # PlazoDeEntrega, esto es solo cada cuanto se mira.
      intervalo-minutos: ${PLAZO_ENTREGA_VIGILANCIA_INTERVALO_MINUTOS:720}
      # Corto a proposito, y menor que el intervalo: si lo igualara, cada despliegue reiniciaria la
      # cuenta y con despliegues diarios la tarea no correria nunca.
      retraso-inicial-minutos: ${PLAZO_ENTREGA_VIGILANCIA_RETRASO_INICIAL_MINUTOS:5}
    comprobantes:
      # El comprobante de la compra, al correo de quien compró. Pocos minutos y no horas: llega
      # mientras esa persona todavía está pendiente de lo que acaba de comprar. Que no sea
      # instantáneo es a propósito — mandar correos no tiene por qué colgar del camino del dinero.
      intervalo-minutos: ${PEDIDO_COMPROBANTES_INTERVALO_MINUTOS:2}
      # Menor que el intervalo, como siempre: si lo igualara, cada despliegue reiniciaría la cuenta.
      retraso-inicial-minutos: ${PEDIDO_COMPROBANTES_RETRASO_INICIAL_MINUTOS:1}
  gcs:
    # bucket-imagenes y url-publica no son secretos (docs/07-infra-gcp.md los documenta), por eso
    # sí llevan default real — a diferencia de los placeholders de Wompi de abajo, que son secretos
    # y nunca deben tener un valor real por defecto (regla dura #5). Las credenciales para firmar
    # las resuelve el SDK vía GOOGLE_APPLICATION_CREDENTIALS, fuera de este bloque.
    #
    # **El valor por omisión es el bucket de local, y eso es la corrección, no un detalle.** Hasta
    # el 23 de septiembre de 2026 era `tecnosport-dev-imagenes`, el del ambiente desplegado: un
    # `bootRun` en esta máquina sin variables escribía en el bucket de dev, y así los dos ambientes
    # acabaron compartiéndolo — 648 objetos, 348 de local y 300 de dev, y un informe de huérfanos
    # que tuvo que aprender a distinguirlos para no proponer borrar las imágenes vivas del otro
    # lado (deuda 29, ADR-0058). Un valor por omisión describe dónde corre el proceso por omisión,
    # que es esta máquina; el ambiente desplegado fija sus variables desde Terraform y no depende
    # de esta línea.
    #
    # **La URL pública sale del bucket, no de un segundo literal.** Cuando eran dos, Terraform fijó
    # solo el bucket: dev subía a `tecnosport-dev-imagenes` y guardaba en la base URLs de
    # `tecnosport-local-imagenes`, que daban 404 — del 23 de septiembre al 1 de octubre de 2026.
    # `GCS_URL_PUBLICA` queda para cuando haya un CDN delante; si apunta a storage.googleapis.com,
    # `PropiedadesGcs` exige que sea el mismo bucket.
    bucket-imagenes: ${GCS_BUCKET_IMAGENES:tecnosport-local-imagenes}
    url-publica: ${GCS_URL_PUBLICA:https://storage.googleapis.com/${tecnosport.gcs.bucket-imagenes}}
    minutos-url-firmada: ${GCS_MINUTOS_URL_FIRMADA:15}
  wompi:
    # La llave pública conserva un marcador de sandbox: no es secreta y con ella no se firma nada.
    # Los dos secretos NO tienen valor por omisión aquí, sino en application-local.yml: con el de
    # eventos publicado en el repositorio, cualquiera podía inventar un webhook APPROVED en un
    # despliegue que olvidara la variable (ClavesSinValorDeEjemploTest). Los despliegues los
    # reciben desde Secret Manager (docs/07-infra-gcp.md).
    llave-publica: ${WOMPI_LLAVE_PUBLICA:pub_test_placeholder}
    secreto-integridad: ${WOMPI_SECRETO_INTEGRIDAD}
    secreto-eventos: ${WOMPI_SECRETO_EVENTOS}
    ambiente: ${WOMPI_AMBIENTE:sandbox}
    metodos:
      # Lo que la CUENTA de Wompi tiene activado hoy, que no es lo mismo que lo que el codigo sabe
      # procesar. Separados por comas, de MetodoPago, y solo metodos que pasen por la pasarela.
      #
      # DESDE EL 28 DE SEPTIEMBRE DE 2026 EL UNICO VALOR POSIBLE ES `WOMPI`, porque el enum agrupo
      # ahi los cuatro medios de la pasarela (V66). O sea que esto quedo siendo un interruptor
      # —lista vacia apaga la pasarela, `WOMPI` la enciende— con forma de lista.
      #
      # Se deja como lista y no se convierte en un booleano tipo SISTECREDITO_HABILITADO a
      # proposito: cambiar la forma obliga a tocar WOMPI_METODOS_HABILITADOS en el despliegue, y un
      # despliegue con la variable vieja arrancaria con la pasarela apagada y el checkout ofreciendo
      # solo transferencia y contraentrega, sin que nada falle. El dia que se toquen las variables
      # de Cloud Run por otra razon, este es el momento de pasarla a booleano.
      #
      # ADDI YA NO ES UN VALOR DE MetodoPago (22 de septiembre de 2026, V61). Estuvo fuera de
      # esta lista desde el 14 de septiembre porque Addi exige que el sitio este en linea para
      # estudiar la activacion, y el 22 se quito del enum: un valor que solo se mantenia fuera del
      # checkout por no estar aqui. Cuando se integre de verdad vuelve a las dos partes, y hay que
      # devolver la frase de los terminos que se quito con esto (docs/11-pagos-y-envios.md).
      habilitados: ${WOMPI_METODOS_HABILITADOS:WOMPI}
    conciliacion:
      intervalo-minutos: ${WOMPI_CONCILIACION_INTERVALO_MINUTOS:15}
      antiguedad-minima-minutos: ${WOMPI_CONCILIACION_ANTIGUEDAD_MINIMA_MINUTOS:15}
  sistecredito:
    # La SEGUNDA pasarela (adr/0048). Arranca apagada, y no por prudencia generica: falta el monto
    # minimo del credito, que lo define Sistecredito y no es publico. Encenderla sin ese dato no
    # arranca, a proposito.
    habilitado: ${SISTECREDITO_HABILITADO:false}
    url-base: ${SISTECREDITO_URL_BASE:https://api.credinet.co/pay}
    # Las tres credenciales. Sin valor por omision que parezca real (regla dura #5): esta cuenta
    # SOLO tiene credenciales productivas, asi que un placeholder que funcionara seria peor que
    # uno que no.
    llave-suscripcion: ${SISTECREDITO_SUBSCRIPTION_KEY:}
    store-id: ${SISTECREDITO_STORE_ID:}
    vendor-id: ${SISTECREDITO_VENDOR_ID:}
    # El header SCOrigen. Production porque no hay ambiente de pruebas para esta cuenta; lo
    # confirmo la asesora el 20 de septiembre de 2026.
    ambiente: ${SISTECREDITO_AMBIENTE:Production}
    # {idioma} lo reemplaza el caso de uso con el idioma del comprador, validado contra una lista
    # cerrada. Hace falta: las rutas del sitio llevan prefijo de idioma y la ruta comodin redirige
    # a /es PERDIENDO los parametros, asi que una URL sin prefijo se traga el retorno entero.
    # A donde vuelve el comprador y a donde llegan las notificaciones. Se derivan de las URL
    # publicas por omision y se pueden fijar aparte. LA DE CONFIRMACION TIENE QUE SER PUBLICA:
    # en local no llega ninguna notificacion, por eso las pruebas van contra el despliegue de dev.
    url-respuesta: ${SISTECREDITO_URL_RESPUESTA:${APP_URL_PUBLICA:http://localhost:4200}/{idioma}/checkout/sistecredito/retorno}
    url-confirmacion: ${SISTECREDITO_URL_CONFIRMACION:${API_URL_PUBLICA:http://localhost:8080}/api/v1/pagos/sistecredito/confirmacion}
    # El id del medio de pago Sistecredito dentro de su propia pasarela. Vale 2 en Staging y en
    # Production (guia G-ALI-12), asi que no es un secreto ni cambia por despliegue; es variable
    # igual porque lo genera Sistecredito y podria cambiarlo.
    metodo-de-pago-id: ${SISTECREDITO_METODO_ID:2}
    timeout-segundos: ${SISTECREDITO_TIMEOUT_SEGUNDOS:10}
    # La URL de pago no llega en la respuesta de creacion: hay que sondear la consulta hasta que
    # aparezca (G-ALI-12). Parametros tecnicos del sondeo, no datos de negocio.
    sondeo-intentos: ${SISTECREDITO_SONDEO_INTENTOS:10}
    sondeo-espera-milis: ${SISTECREDITO_SONDEO_ESPERA_MILIS:700}
    # EL FRENO DE SEGURIDAD. Sin ambiente de pruebas, este booleano es lo unico que separa una
    # prueba de un credito real a nombre de una persona. Encendido, la pasarela simula el estado
    # de abajo sin cobrarle a nadie — y encendido en produccion despacharia mercancia regalada sin
    # que nada fallara. ConfiguracionSistecredito se niega a arrancar si esta encendido y el
    # despliegue no declara un perfil de pruebas (local, dev, e2e o pruebas); sin ningun perfil,
    # tampoco.
    sandbox-activo: ${SISTECREDITO_SANDBOX_ACTIVO:false}
    sandbox-estado: ${SISTECREDITO_SANDBOX_ESTADO:Approved}
    # El minimo del credito por debajo del cual la pasarela responde 802. Confirmado por el duenno
    # del negocio el 22 de septiembre de 2026: 50.000 COP. No es publico ni esta en la
    # documentacion entregada —dos comercios aliados publican 20.000 y 30.000—, porque varia por
    # comercio; el dato de ESTE comercio es el de arriba.
    #
    # SIGUE SIN VALOR POR OMISION, y ahora es una decision y no una falta: varia por comercio y
    # puede cambiar, asi que un despliegue que olvide la variable tiene que no arrancar con el
    # metodo encendido, en vez de cobrar con una cifra que alguien escribio aqui hace meses. El
    # valor se declara en el despliegue (docs/07-infra-gcp.md).
    monto-minimo: ${SISTECREDITO_MONTO_MINIMO:}
    conciliacion:
      # Hace mas falta que la de Wompi: si el comprador cierra la ventana en vez de pulsar "volver
      # al comercio", la confirmacion puede tardar hasta tres minutos (G-ALI-12), y una notificacion
      # que no se pudo verificar no aplica nada y queda esperando aqui.
      intervalo-minutos: ${SISTECREDITO_CONCILIACION_INTERVALO_MINUTOS:10}
      antiguedad-minima-minutos: ${SISTECREDITO_CONCILIACION_ANTIGUEDAD_MINIMA_MINUTOS:5}
  contraentrega:
    vencimiento:
      # Decisión de negocio del 4 de octubre de 2026: un pedido contraentrega que nadie verificó en
      # 48 horas se cancela y libera su mercancía. Sin plazo, cualquiera bloqueaba existencia sin
      # pagar nada confirmando pedidos con correos distintos.
      horas-para-verificar: ${CONTRAENTREGA_HORAS_PARA_VERIFICAR:48}
      intervalo-minutos: ${CONTRAENTREGA_VENCIMIENTO_INTERVALO_MINUTOS:60}
    # Dato de negocio real, no inventado (regla dura #5): arranca deshabilitada a proposito.
    # Se activa explicito cuando el negocio confirme la cobertura.
    habilitada: ${CONTRAENTREGA_HABILITADA:false}
    # El rango que recauda la transportadora, no una preferencia del negocio: COP 2.000 y
    # COP 2.000.000, lo que reporta la ayuda publica de Skydropx (docs/12-legales-de-envio.md, 4).
    # El maximo estuvo en 100000, declarado en este mismo sitio como marcador de desarrollo.
    # Se comparan contra el TOTAL del pedido, flete incluido: es lo que se cobra en la puerta.
    #
    # EL TECHO ES LA REGLA DE LO TECNOLOGICO, y conviene saberlo antes de tocarlo. La decision de
    # negocio del 14 de septiembre de 2026 es: lo tecnologico por encima de COP 2.000.000 no va
    # contra entrega, y un celular por debajo de esa cifra SI puede ir. Como el tope se compara
    # contra el total del pedido, este unico valor ya la implementa — nada que pase de 2.000.000
    # califica, sea un celular o una camiseta. Bajarlo volveria a excluir celulares que el
    # negocio si quiere despachar contra entrega.
    monto-minimo: ${CONTRAENTREGA_MONTO_MINIMO:2000}
    monto-maximo: ${CONTRAENTREGA_MONTO_MAXIMO:2000000}
    # Lista separada por comas de LineaCatalogo: ROPA_Y_CALZADO, BOLSOS, TECNOLOGIA. Esos son los
    # tres valores del enum; CELULARES dejo de serlo el 14 de septiembre de 2026 y ponerlo aqui
    # impide arrancar. El comentario lo siguio nombrando hasta el 18, que es justo el sitio donde
    # alguien lo iba a leer bajo presion.
    #
    # Vacia a proposito: la regla del negocio es por PRECIO, no por linea, y la implementa
    # monto-maximo. Excluir TECNOLOGIA entera bloquearia tambien los celulares de 1.299.900 y
    # 1.499.900, que el negocio si quiere despachar contra entrega. Esta lista queda para el dia que alguna linea
    # no deba ir contra entrega a ningun precio, que hoy no es el caso de ninguna.
    categorias-excluidas: ${CONTRAENTREGA_CATEGORIAS_EXCLUIDAS:}
  # Difusion en redes sociales (Facebook e Instagram) desde el panel.
  proveedores:
    # El bucket PRIVADO de los originales del proveedor: exportaciones subidas y fotos tal como
    # llegaron. Distinto del de imagenes, y tambien uno por ambiente (ADR-0058): el valor por
    # omision es el de local, que crea infra/local/bucket-imagenes.mjs; el desplegado lo fija
    # Terraform. Nada de aqui es publico: el panel lee con URL firmada.
    bucket: ${GCS_BUCKET_PROVEEDORES:tecnosport-local-proveedores}
    minutos-url-firmada: ${GCS_MINUTOS_URL_FIRMADA:15}
    # Parametros tecnicos, no datos de negocio. El zip se abre entero en memoria dentro de una
    # instancia de Cloud Run, y 30 MB es lo que cabe con holgura; lo descomprimido se acota aparte
    # porque un zip que infle a gigas no es una exportacion de WhatsApp.
    exportacion-maxima-bytes: ${PROVEEDORES_EXPORTACION_MAXIMA_BYTES:31457280}
    descomprimido-maximo-bytes: ${PROVEEDORES_DESCOMPRIMIDO_MAXIMO_BYTES:209715200}
    # La foto que se sube a un borrador desde el panel: confirmarla y aprobarla la abren entera en
    # memoria. 10 MB cubre la foto de un telefono sin recortar; una de WhatsApp pesa menos de uno.
    foto-maxima-bytes: ${PROVEEDORES_FOTO_MAXIMA_BYTES:10485760}
    # Cuantos lotes caben esperando. Corta a proposito: un lote tarda minutos y el panel lo usa una
    # persona, asi que una cola llena no es carga, es alguien pulsando muchas veces.
    cola-de-ingestas: ${PROVEEDORES_COLA_DE_INGESTAS:20}
    # El factor con que se sugiere el precio de venta a partir del del proveedor, por linea;
    # un proveedor puede traer el suyo y entonces manda. Son los del documento de la ingesta
    # (30 de septiembre de 2026); es una sugerencia y quien aprueba pone el precio final.
    margen-por-linea:
      BOLSOS: ${PROVEEDORES_MARGEN_BOLSOS:1.35}
      ROPA: ${PROVEEDORES_MARGEN_ROPA:1.30}
    # Despues del factor, lo que el precio sugerido le gana a cada unidad se lleva a estos topes,
    # en pesos: para todas las lineas y tambien con el factor propio del proveedor (3 de octubre
    # de 2026). Ajustan la sugerencia; quien aprueba puede poner otro precio.
    ganancia:
      minima: ${PROVEEDORES_GANANCIA_MINIMA:20000}
      maxima: ${PROVEEDORES_GANANCIA_MAXIMA:30000}
    huella:
      # Hasta cuantos bits de 64 pueden diferir dos pHash para ser la misma foto. Parametro
      # tecnico: 6 es lo habitual para reconocer la misma imagen reescalada o recomprimida.
      umbral-hamming: ${PROVEEDORES_UMBRAL_HAMMING:6}
    # Cuanto puede llevar un producto de proveedor sin aparecer en sus mensajes antes de
    # ocultarse. Tres dias es lo que pidio el negocio (30 de septiembre de 2026); en pruebas
    # se baja a minutos. Duracion ISO-8601: P3D, PT10M.
    ventana-disponibilidad: ${PROVEEDORES_VENTANA_DISPONIBILIDAD:P3D}
    job-expiracion:
      # Dentro de la aplicacion, como las demas tareas (docs/07): en produccion la API lleva la
      # CPU siempre asignada. Encendido por omision; la bandera existe para apagarlo sin
      # desplegar. Con varias instancias corre en cada una y no importa: es idempotente.
      habilitado: ${PROVEEDORES_JOB_EXPIRACION_HABILITADO:true}
      intervalo: ${PROVEEDORES_JOB_EXPIRACION_INTERVALO:PT24H}
      retraso-inicial: ${PROVEEDORES_JOB_EXPIRACION_RETRASO_INICIAL:PT5M}
    extraccion:
      # La API de Claude con salida estructurada (platform.claude.com/docs/en/build-with-claude/
      # structured-outputs). La clave vive en Secret Manager; VACIA, el extractor es el sembrado
      # y el arranque lo avisa en el registro (regla dura #5: ningun valor real por omision).
      url-base: ${ANTHROPIC_URL_BASE:https://api.anthropic.com}
      api-key: ${ANTHROPIC_API_KEY:}
      # Uno de los modelos que la documentacion lista con salida estructurada, verificado el 30 de
      # septiembre de 2026. Alternativa mas capaz y mas cara: claude-sonnet-4-6.
      modelo: ${PROVEEDORES_EXTRACCION_MODELO:claude-haiku-4-5-20251001}
      # Un mensaje puede traer hasta cinco productos (el tope de ExtraerProductoDePublicacion), y
      # cada uno ronda los 200 tokens de salida: 1024 alcanzaba para uno y se cortaba con cinco.
      max-tokens: ${PROVEEDORES_EXTRACCION_MAX_TOKENS:2048}
      # Por debajo de esta confianza del propio extractor el borrador lleva alerta. No es un dato
      # de negocio: es cuanto se le cree a un modelo.
      umbral-confianza: ${PROVEEDORES_EXTRACCION_UMBRAL_CONFIANZA:0.75}
      timeout: ${PROVEEDORES_EXTRACCION_TIMEOUT:PT30S}
      # Reintentos ante 429 y 5xx, con espera exponencial desde la inicial.
      intentos: ${PROVEEDORES_EXTRACCION_INTENTOS:4}
      espera-inicial: ${PROVEEDORES_EXTRACCION_ESPERA_INICIAL:PT2S}
      # Cuanto silencio cierra una publicacion: un texto con precio abre, y lo que llegue dentro de
      # esta ventana desde el ultimo mensaje anexado es suyo.
      ventana-agrupacion: ${PROVEEDORES_VENTANA_AGRUPACION:PT15M}

  meta:
    # La version va dentro de la ruta y Meta retira versiones con calendario publicado: congelarla
    # en el codigo obligaria a un despliegue cada vez.
    url-base: ${META_URL_BASE:https://graph.facebook.com/v26.0}
    # Medidos contra la cuenta real el 29 de septiembre de 2026 con el token del usuario del
    # sistema. No son secretos -- son identificadores publicos de la pagina y del perfil -- pero
    # entran por variable de entorno igual, para poder apuntar a otra cuenta sin recompilar.
    page-id: ${META_PAGE_ID:100737384988350}
    ig-user-id: ${META_IG_USER_ID:17841411711270701}
    # Este SI es secreto y vive en Secret Manager. El valor de aqui no autentica contra nada
    # (regla dura #5).
    token: ${META_TOKEN:token_pendiente_de_configurar}
    # El origen que se pinta en el enlace del pie. Lleva www por decision del 29 de septiembre de
    # 2026; el certificado todavia no cubre el subdominio y hay que arreglarlo en produccion.
    url-base-del-sitio: ${META_URL_BASE_DEL_SITIO:https://www.tecnosport.co}
    # Las que van en todo lo que se publique. Las de cada categoria viven en la categoria.
    hashtags-de-marca: ${META_HASHTAGS_DE_MARCA:}
    # FALSE POR OMISION A PROPOSITO. No hay sandbox de la Graph API: la unica cuenta que existe es
    # la real del negocio, asi que bootRun en una maquina de desarrollo apunta a ella. Encenderlo
    # es un acto deliberado de quien despliega, no un descuido de quien prueba.
    publicar-de-verdad: ${META_PUBLICAR_DE_VERDAD:false}
    # Parametros tecnicos del sondeo del contenedor de Instagram, que es asincrono: sin sondear,
    # publicar un contenedor a medias devuelve un error que parece de permisos y no lo es.
    timeout-segundos: ${META_TIMEOUT_SEGUNDOS:15}
    sondeos-del-contenedor: ${META_SONDEOS_DEL_CONTENEDOR:10}
    espera-entre-sondeos-segundos: ${META_ESPERA_ENTRE_SONDEOS_SEGUNDOS:2}

  skydropx:
    # El host de PRUEBAS sí está confirmado, y este es: sb-pro.skydropx.com es el único de los
    # candidatos que autentica con las credenciales del sandbox — api-pro y pro responden
    # invalid_client. Contra él se cotiza, se emitieron guías reales y se verificó la firma del
    # webhook (docs/13-skydropx-capacidades.md §6.10).
    #
    # Lo que sigue sin confirmar es el de PRODUCCIÓN: la documentación pública muestra
    # pro.skydropx.com y el panel indica api-pro.skydropx.com, y eso no se puede comprobar sin
    # credenciales de producción, que es lo que falta. Por eso esto es configuración y no una
    # constante con dos ambientes como en WompiClient: ahí los dos hosts están documentados.
    url-base: ${SKYDROPX_URL_BASE:https://sb-pro.skydropx.com}
    # Credenciales de desarrollo que no autentican contra nada (regla dura #5). Producción las
    # sobrescribe desde Secret Manager.
    client-id: ${SKYDROPX_CLIENT_ID:client_id_pendiente_de_configurar}
    client-secret: ${SKYDROPX_CLIENT_SECRET:client_secret_pendiente_de_configurar}
    # Parámetros técnicos del sondeo, no datos de negocio: la cotización es asíncrona y hay que
    # decidir cuánto se espera antes de darla por fallida. Diez segundos es lo que un comprador
    # tolera mirando un resumen de pedido sin total.
    cotizacion-timeout-segundos: ${SKYDROPX_COTIZACION_TIMEOUT_SEGUNDOS:10}
    cotizacion-intentos: ${SKYDROPX_COTIZACION_INTENTOS:8}
    # El minimo asegurable POR BULTO que exige la plataforma, medido contra la cuenta: un bulto
    # declarado por debajo responde 422 y tumba la cotizacion ENTERA, no ese bulto
    # (docs/13-skydropx-capacidades.md §6.4). Los bultos que quedan por debajo se elevan hasta aqui
    # en vez de dejar sin envio a domicilio al carrito que lleve un cable barato (adr/0035).
    #
    # No es un dato de negocio nuestro que se pueda elegir: es la validacion de ellos. Se toca
    # cuando ellos la cambien, y entonces se vuelve a medir antes de tocarla.
    valor-declarado-minimo: ${SKYDROPX_VALOR_DECLARADO_MINIMO:10000}
    # Y el otro extremo del mismo rango, medido igual (docs/13 §6.13): 5.000.000 cotiza, 5.000.001
    # responde 422. Aqui NO se recorta: un articulo que vale mas que esto no va a domicilio y el
    # checkout lo dice, porque declarar un celular de ocho millones en cinco dejaria tres sin
    # asegurar y esa diferencia la pondria el negocio (adr/0036).
    valor-declarado-maximo: ${SKYDROPX_VALOR_DECLARADO_MAXIMO:5000000}
    webhook:
      # Dónde viene la firma del evento. Sigue siendo variable, pero ya no porque no se supiera:
      # la plataforma deja elegir el nombre de la cabecera en el panel, con Authorization por
      # omisión (docs/13-skydropx-capacidades.md, sección 6.1).
      cabecera-firma: ${SKYDROPX_CABECERA_FIRMA:authorization}
      # El secreto con el que Skydropx firma el evento. Lo ponemos nosotros y se teclea igual en el
      # panel (Conexiones > Webhooks): es una clave compartida, y se rota en los dos sitios o en
      # ninguno. Dev lo tiene desde el 16 de septiembre de 2026. Sin valor por omisión aquí: el
      # marcador que hubo no rechazaba toda firma, como decía este comentario, sino que aceptaba
      # cualquiera hecha con él mismo, y un evento de entrega inventado arranca el plazo de
      # retracto. El de desarrollo vive en application-local.yml.
      secreto: ${SKYDROPX_SECRETO_WEBHOOK}
    seguimiento:
      # Cada cuánto le pregunta la conciliación a la transportadora por los envíos callados, y
      # desde cuándo se considera callado uno. Las doce horas no son capricho: menos que eso
      # pisaría al webhook, que suele traer el evento antes, y gastaría cuota de un proveedor
      # limitado a dos peticiones por segundo para llegar a la misma conclusión.
      intervalo-minutos: ${SKYDROPX_SEGUIMIENTO_INTERVALO_MINUTOS:360}
      antiguedad-minima-horas: ${SKYDROPX_SEGUIMIENTO_ANTIGUEDAD_MINIMA_HORAS:12}
      # Techo del lote: cada envío revisado es una llamada al proveedor, y la tarea corre dentro
      # de una transacción. Veinticinco a dos peticiones por segundo son unos trece segundos en el
      # peor caso; lo que no quepa espera a la vuelta siguiente.
      maximo-por-corrida: ${SKYDROPX_SEGUIMIENTO_MAXIMO_POR_CORRIDA:25}
    emision:
      # Mucho más seguido que el seguimiento, y con razón: el seguimiento vigila cosas que pasan en
      # días, y esto espera una respuesta que llega en segundos o minutos con un pedido pagado
      # esperándola. Medido: 25 s el caso bueno, más de 4 min el que terminó en error
      # (docs/13-skydropx-capacidades.md §6.10). Solo hay algo que revisar cuando alguien acaba de
      # pulsar el botón, así que el costo de la frecuencia es cero la mayor parte del tiempo.
      intervalo-segundos: ${SKYDROPX_EMISION_INTERVALO_SEGUNDOS:60}
      # Apagada desde el 7 de octubre de 2026 (adr/0071): las guias se crean a mano en el panel de
      # Skydropx ("Cotizar y crear") y se registran con su numero. Con las dos vias abiertas, un clic
      # de mas paga dos guias para el mismo pedido. Se enciende el dia que el flujo se automatice.
      automatica: ${SKYDROPX_EMISION_AUTOMATICA:false}
  saldo-envios:
    # Dato de negocio decidido el 17 de septiembre de 2026: por debajo de esto hay que avisar.
    # No es una cifra redonda por comoda — es lo que alcanza para unas seis guias baratas o dos
    # caras (8.200 la mas barata que de verdad emite, 19.465 la mas cara, medidas contra la cuenta)
    # y es el tamano de la recarga que Skydropx hizo el 16 de septiembre. Lo que este aviso tiene
    # que conseguir es margen para pedir la recarga y para que llegue: entre pedirla y recibirla
    # pasan dias, y la recarga por Mercado Pago nunca funciono.
    umbral-cop: ${ENVIO_SALDO_UMBRAL_COP:50000}
    # Solo cada cuanto se pregunta. Doce horas porque el saldo baja al emitir, emitir lo dispara una
    # persona desde el panel, y la respuesta al aviso tarda mas de un dia: preguntar mas seguido no
    # adelantaria nada y gastaria cuota de un proveedor limitado a dos peticiones por segundo.
    intervalo-minutos: ${ENVIO_SALDO_INTERVALO_MINUTOS:720}
    # Corto y menor que el intervalo, mismo motivo que los otros dos vigilantes.
    retraso-inicial-minutos: ${ENVIO_SALDO_RETRASO_INICIAL_MINUTOS:5}
    # El mismo correo del negocio que el aviso de la bandeja, y por lo mismo: no es un secreto.
    destinatario: ${ENVIO_SALDO_DESTINATARIO:contacto@tecnosport.co}
  sobrecostos-envios:
    # Cuantos dias atras se pregunta. No es un dato de negocio: es el ancho de la ventana. Treinta
    # porque la transportadora reliquida semanas despues de la entrega, y porque el orden en que la
    # plataforma devuelve los cobros no esta documentado — preguntar por ventana es lo unico que no
    # se apoya en un orden que nadie prometio. Releer la misma ventana no cuesta nada: de lo ya
    # avisado no se avisa dos veces (tabla aviso_sobrecosto).
    dias-atras: ${ENVIO_SOBRECOSTOS_DIAS_ATRAS:30}
    # Un dia. El cargo aparece dias despues del despacho, asi que preguntar mas seguido no adelanta
    # nada y gasta cuota de un proveedor limitado a dos peticiones por segundo. Es el vigilante menos
    # urgente de los tres: nadie se queda sin despachar por esto — lo que se pierde es saber cuanto
    # costo de verdad un pedido.
    intervalo-minutos: ${ENVIO_SOBRECOSTOS_INTERVALO_MINUTOS:1440}
    # Corto y menor que el intervalo, mismo motivo que los otros dos vigilantes.
    retraso-inicial-minutos: ${ENVIO_SOBRECOSTOS_RETRASO_INICIAL_MINUTOS:7}
    # El mismo correo del negocio que los otros dos avisos, y por lo mismo: no es un secreto.
    destinatario: ${ENVIO_SOBRECOSTOS_DESTINATARIO:contacto@tecnosport.co}
  revision-envios:
    # Dato de negocio, a diferencia del intervalo de al lado: cuanto tiempo puede quedarse algo en
    # la bandeja de revision sin que nadie lo mire. Veinticuatro horas, porque el comprador de un
    # pedido despachado espera movimiento diario y enterarse despues que el es justo lo que la
    # bandeja vino a evitar.
    horas-umbral: ${ENVIO_REVISION_HORAS_UMBRAL:24}
    # Solo cada cuanto se mira. Seis horas contra un umbral de veinticuatro: lo bastante seguido
    # para que el aviso no llegue con medio dia de retraso, y lo bastante espaciado para que una
    # bandeja vacia no cueste nada.
    intervalo-minutos: ${ENVIO_REVISION_INTERVALO_MINUTOS:360}
    # Corto y menor que el intervalo, mismo motivo que el vigilante del plazo de entrega: si lo
    # igualara, cada despliegue reiniciaria la cuenta y con despliegues diarios no correria nunca.
    retraso-inicial-minutos: ${ENVIO_REVISION_RETRASO_INICIAL_MINUTOS:5}
    # No es un secreto: es el correo del negocio que ya esta publicado en el pie del sitio y en
    # los legales, asi que lleva valor por omision real (regla dura #5).
    destinatario: ${ENVIO_REVISION_DESTINATARIO:contacto@tecnosport.co}
  origen:
    # La dirección de despacho del negocio, que es la misma del punto de recogida y ya está
    # decidida (docs/09-plan-de-arranque.md, cierre de datos pendientes del 10/09/2026).
    nombre: ${ORIGEN_NOMBRE:Tecno Sport}
    # El mismo celular que publica el pie del sitio y los textos legales (npm run datos-negocio
    # vigila que no se separen). No es un número inventado.
    telefono: ${ORIGEN_TELEFONO:+573138816711}
    # Entre comillas obligatorias: el "#" de la nomenclatura abre un comentario en YAML y la
    # dirección se cortaría en "Cra. 26C" sin que nada fallara.
    direccion: "${ORIGEN_DIRECCION:Cra. 26C # 38B-31, apto. 401, La Milagrosa}"
    # Los nombres, que Skydropx exige aparte del código DANE: sin ellos la cotización responde
    # 422 "area_level1/area_level2 no puede estar en blanco". Las grafías son las de DIVIPOLA,
    # las mismas que manda el frontend en la dirección de destino.
    departamento: ${ORIGEN_DEPARTAMENTO:Antioquia}
    ciudad: ${ORIGEN_CIUDAD:Medellín}
    # Medellín en DIVIPOLA. Ojo: esto es lo que Skydropx recibe como "postal_code" — su catálogo
    # es el DANE, no el postal de cinco dígitos.
    ciudad-dane: ${ORIGEN_CIUDAD_DANE:05001}
    # Opcional a propósito: en Colombia no se usa de forma fiable y muchas transportadoras lo
    # ignoran. Exigirlo impediría arrancar por un dato que a nadie le sirve.
    codigo-postal: ${ORIGEN_CODIGO_POSTAL:}
    # El barrio, y no es un adorno: viaja como area_level3 en la cotización, el envío lo hereda de
    # ahí, y sin él POST /pickups responde "Shipper address2 not valid" y GET /pickups/coverage
    # devuelve un 422 con el mensaje vacío. Dos sesiones dieron eso por roto del lado de Skydropx
    # y era esto (docs/13-skydropx-capacidades.md §6.10). Ya estaba dentro de `direccion` como
    # texto; la plataforma lo quiere en su propio campo.
    barrio: ${ORIGEN_BARRIO:La Milagrosa}
    # `reference` es obligatorio en la dirección de origen al emitir, y se imprime en la guía: es
    # lo que lee el mensajero que viene a recoger. Dato de negocio, decidido el 16/09/2026.
    referencia: ${ORIGEN_REFERENCIA:Apartamento 401}
    # No viaja en la cotización: lo exige la guía, que pide email en las dos direcciones. Es el
    # correo público del negocio —el mismo del pie y de los textos legales— y no el remitente
    # transaccional, porque lo que escriba la transportadora tiene que leerlo una persona.
    correo: ${ORIGEN_CORREO:contacto@tecnosport.co}
  transferencia-manual:
    # Las cuentas a las que el comprador puede transferir. Eran cuatro campos sueltos —una sola
    # cuenta— hasta el 28 de septiembre de 2026; el pie ya nombraba tres medios de transferencia,
    # asi que el sitio prometia a la vista algo que el checkout no podia dar.
    #
    # QUE CUENTAS HAY SE DECIDE AQUI Y QUE DICEN SE DECIDE FUERA. La entidad y el tipo van fijos
    # porque no son secreto ni cambian: Nequi y Daviplata son billeteras —se identifican con un
    # numero de celular— y BBVA es una cuenta de ahorros. El numero y el titular entran por
    # variable de entorno, con nombres legibles en vez de los indices que Spring exigiria para una
    # lista entera (TECNOSPORT_TRANSFERENCIAMANUAL_CUENTAS_0_NUMERO): quien opera el despliegue
    # tiene que poder leer lo que escribe.
    #
    # Dato de negocio real, no inventado (regla dura #5): estos placeholders nunca sirven para
    # transferir de verdad. Y el titular es el nombre de QUIEN TIENE LA CUENTA, no el nombre
    # comercial: el sitio lo opera una persona natural, sin sigla societaria
    # (docs/08-seguridad-legal.md).
    cuentas:
      - entidad: Nequi
        tipo: billetera
        numero: ${TRANSFERENCIA_NEQUI_NUMERO:numero_pendiente_de_configurar}
        titular: ${TRANSFERENCIA_NEQUI_TITULAR:titular_pendiente_de_configurar}
      - entidad: Daviplata
        tipo: billetera
        numero: ${TRANSFERENCIA_DAVIPLATA_NUMERO:numero_pendiente_de_configurar}
        titular: ${TRANSFERENCIA_DAVIPLATA_TITULAR:titular_pendiente_de_configurar}
      - entidad: BBVA
        tipo: ahorros
        numero: ${TRANSFERENCIA_BBVA_NUMERO:numero_pendiente_de_configurar}
        titular: ${TRANSFERENCIA_BBVA_TITULAR:titular_pendiente_de_configurar}
  jwt:
    # Sin valor por omisión: con uno publicado, cualquiera firmaba un JWT de ADMIN en el despliegue
    # que olvidara la variable. El de desarrollo vive en application-local.yml (regla dura #5).
    secreto: ${JWT_SECRETO}
    minutos-acceso: ${JWT_MINUTOS_ACCESO:15}
    dias-refresco: ${JWT_DIAS_REFRESCO:30}
  admin-semilla:
    # Dato de negocio real, no inventado (regla dura #5). La clave no tiene valor por omisión
    # aquí: el primer admin de un despliegue nuevo nacería con la del repositorio. La de desarrollo
    # vive en application-local.yml.
    correo: ${ADMIN_CORREO:admin@tecnosport.co}
    clave: ${ADMIN_CLAVE}
  idempotencia:
    purga:
      # Cada cuánto se borran las respuestas vencidas (24 horas) y las reclamaciones abandonadas.
      # Guardan datos personales del pedido, así que no pueden quedarse indefinidamente.
      intervalo-minutos: ${IDEMPOTENCIA_PURGA_INTERVALO_MINUTOS:60}
  carrito:
    purga:
      # docs/02-modelo-datos.md: "el carrito vive 30 días". Se cuentan desde la última actividad,
      # no desde la creación (ver Carrito).
      dias-retencion: ${CARRITO_DIAS_RETENCION:30}
      # En horas, no en minutos: purgar carritos no es urgente, y barrer seguido una tabla que casi
      # nunca tiene nada que borrar solo gasta base de datos.
      intervalo-minutos: ${CARRITO_PURGA_INTERVALO_MINUTOS:360}
  negocio:
    # Hoy el negocio NO es responsable de IVA (par. 3 del art. 437 del Estatuto Tributario). Con
    # `false`, el panel no deja dar de alta una variante con tasa distinta de cero: adicionar IVA al
    # precio sin ser responsable obliga a cumplir íntegramente el régimen de los responsables
    # (Decreto 1625 de 2016, art. 1.3.1.15.2, literal a). La calidad se pierde al cruzar los topes
    # del par. 3, y ese día esta variable pasa a true junto con el texto publicado. Ver adr/0041.
    responsable-de-iva: ${NEGOCIO_RESPONSABLE_IVA:false}
  legal:
    # Fecha de vigencia del texto publicado en /legales/privacidad. Va acoplada al texto, que vive
    # en los JSON de Transloco de este mismo repositorio: cambiar el texto y cambiar esta fecha son
    # el mismo commit. La variable existe para poder corregirla sin redesplegar, no para tener que
    # fijarla en cada entorno.
    politica-datos-version: ${POLITICA_DATOS_VERSION:2026-09-28}
  verificacion-correo:
    # Ningún doc especifica esta duración (solo la de recuperación, 30 min) — parámetro técnico,
    # no un dato de negocio.
    horas-vencimiento: ${VERIFICACION_CORREO_HORAS_VENCIMIENTO:24}
  recuperacion-clave:
    # docs/08-seguridad-legal.md: "token de un solo uso, válido 30 minutos".
    minutos-vencimiento: ${RECUPERACION_CLAVE_MINUTOS_VENCIMIENTO:30}
  garantia:
    # Doce meses para producto nuevo, que es lo que prometen los terminos publicados. Un productor
    # puede anunciar uno mayor: eso va en meses-por-categoria.
    meses-por-defecto: ${GARANTIA_MESES_POR_DEFECTO:12}
    # categorias-sin-termino-conocido impide inventar un dato: una categoria listada aqui responde
    # INDETERMINADA en vez de caer a los doce meses generales. Hoy va vacia. Los celulares estuvieron
    # ahi por un malentendido: los terminos prometian "la garantia del fabricante" y se trato como
    # dato pendiente del negocio, pero el termino lo fija la ley — un ano para producto nuevo,
    # celulares incluidos (art. 8 de la Ley 1480 de 2011 y concepto de la SIC sobre equipos
    # terminales, verificados el 10 de septiembre de 2026). Si algun productor anuncia uno mayor, va
    # en meses-por-categoria, que es lo que la ley manda respetar.
    categorias-sin-termino-conocido: ${GARANTIA_CATEGORIAS_SIN_TERMINO:}
  atencion:
    # Plazos de respuesta en dias habiles. Los dos primeros son de la Ley 1581 de 2012 (consultas y
    # reclamos de datos personales, con sus prorrogas); el tercero es el que los terminos publicados
    # prometen para las peticiones del consumidor, y ese texto no menciona prorroga.
    dias-consulta-datos: ${ATENCION_DIAS_CONSULTA_DATOS:10}
    dias-prorroga-consulta-datos: ${ATENCION_DIAS_PRORROGA_CONSULTA_DATOS:5}
    dias-reclamo-datos: ${ATENCION_DIAS_RECLAMO_DATOS:15}
    dias-prorroga-reclamo-datos: ${ATENCION_DIAS_PRORROGA_RECLAMO_DATOS:8}
    dias-consumidor: ${ATENCION_DIAS_CONSUMIDOR:15}
  limite-intentos:
    # docs/08-seguridad-legal.md pide el límite, pero no da números — dato de seguridad, no de
    # negocio, ajustable. "auth" agrupa sesión/registro/recuperación (mismo tipo de abuso);
    # "pedidos" es más generoso porque reintentar una compra es normal.
    auth:
      ip-maximo: ${LIMITE_AUTH_IP_MAXIMO:15}
      ip-minutos: ${LIMITE_AUTH_IP_MINUTOS:15}
      cuenta-maximo: ${LIMITE_AUTH_CUENTA_MAXIMO:5}
      cuenta-minutos: ${LIMITE_AUTH_CUENTA_MINUTOS:15}
    # La cotización llama a un proveedor externo con cuota y se paga: es el único endpoint
    # público con ese riesgo. Generoso a propósito — un comprador corrige la dirección varias
    # veces; el tope frena a un script, no a una persona indecisa.
    cotizacion:
      ip-maximo: ${LIMITE_COTIZACION_IP_MAXIMO:60}
      ip-minutos: ${LIMITE_COTIZACION_IP_MINUTOS:30}
    # El seguimiento por número legible es el único endpoint público con un identificador
    # adivinable —los números van del 000001 hacia arriba—, así que el correo es lo único que
    # protege el pedido. El tope es el más estrecho de los cuatro: consultar el propio pedido unas
    # pocas veces al día cabe de sobra, recorrer números no.
    seguimiento:
      ip-maximo: ${LIMITE_SEGUIMIENTO_IP_MAXIMO:10}
      ip-minutos: ${LIMITE_SEGUIMIENTO_IP_MINUTOS:10}
    pedidos:
      ip-maximo: ${LIMITE_PEDIDOS_IP_MAXIMO:30}
      ip-minutos: ${LIMITE_PEDIDOS_IP_MINUTOS:60}
      cuenta-maximo: ${LIMITE_PEDIDOS_CUENTA_MAXIMO:15}
      cuenta-minutos: ${LIMITE_PEDIDOS_CUENTA_MINUTOS:60}
    # El buzon de sugerencias es el unico endpoint publico que escribe una fila y encola un correo
    # sin sesion detras. Escribir una sugerencia es algo que se hace una vez, no quince: cinco por
    # hora desde la misma IP le sobran a cualquiera real. El tope por correo es aun mas estrecho, y
    # protege otra cosa -- que nadie use el buzon con el correo de otra persona.
    sugerencias:
      ip-maximo: ${LIMITE_SUGERENCIAS_IP_MAXIMO:5}
      ip-minutos: ${LIMITE_SUGERENCIAS_IP_MINUTOS:60}
      cuenta-maximo: ${LIMITE_SUGERENCIAS_CUENTA_MAXIMO:3}
      cuenta-minutos: ${LIMITE_SUGERENCIAS_CUENTA_MINUTOS:60}
  sugerencias:
    # El mismo correo del negocio que los avisos de envio, y por lo mismo: no es un secreto.
    destinatario: ${SUGERENCIAS_DESTINATARIO:contacto@tecnosport.co}

springdoc:
