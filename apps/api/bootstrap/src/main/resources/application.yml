server:
  # PORT y no un número fijo: Cloud Run inyecta el puerto en esa variable y espera que el proceso
  # escuche exactamente ahí. En local no está definida y cae a 8080, que es lo de siempre.
  port: ${PORT:8080}

spring:
  application:
    name: tecnosport-api
  datasource:
    # DB_PARAMS al final y vacío por omisión: en local no hace falta nada, pero un Postgres
    # gestionado exige TLS (Neon rechaza la conexión sin `?sslmode=require`) y la plantilla no
    # tenía dónde ponerlo. Encontrado al montar el ambiente desplegado, antes de que costara un
    # despliegue que no arranca.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PUERTO:5432}/${DB_NOMBRE:tecnosport}${DB_PARAMS:}
    username: ${DB_USUARIO:tecnosport}
    password: ${DB_CLAVE:tecnosport}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    # Mailpit en local (docker-compose.yml), SMTP real en producción
    # (docs/07-infra-gcp.md). SMTP_PUERTO no estaba en la lista original de
    # variables del documento — Mailpit usa 1025, no el 587/465 típico de un
    # SMTP real, así que hacía falta poder cambiarlo por entorno igual que
    # DB_PUERTO ya existe junto a DB_HOST. SMTP_AUTH tampoco estaba: Mailpit no
    # exige autenticación, y `auth: true` a secas con usuario/clave vacíos
    # rompe en seco (`jakarta.mail.AuthenticationFailedException: failed to
    # connect, no password specified?`, encontrado en local contra bootRun
    # real) — producción sí lo activa por variable de entorno.
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PUERTO:1025}
    username: ${SMTP_USUARIO:}
    password: ${SMTP_CLAVE:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: true

tecnosport:
  app:
    # La raiz del sitio, con la que el backend arma los enlaces que manda por correo. Misma
    # variable de entorno de siempre: lo que cambio es de quien cuelga, no como se configura.
    url-publica: ${APP_URL_PUBLICA:http://localhost:4200}
  correo:
    # Dato de negocio real, no inventado (regla dura #5): dominio real del proyecto.
    remitente: ${CORREO_REMITENTE:no-responder@tecnosport.co}
  pedido:
    minutos-reserva-inventario: ${MINUTOS_RESERVA_INVENTARIO:30}
    horas-vencimiento-transferencia: ${TRANSFERENCIA_HORAS_VENCIMIENTO:24}
    vigilancia-plazo:
      # El plazo vigilado es de 30 dias calendario (Ley 1480 de 2011, art. 18), asi que medio dia de
      # retraso en detectarlo no le cuesta nada a nadie. No es un dato de negocio: el 30 vive en
      # PlazoDeEntrega, esto es solo cada cuanto se mira.
      intervalo-minutos: ${PLAZO_ENTREGA_VIGILANCIA_INTERVALO_MINUTOS:720}
      # Corto a proposito, y menor que el intervalo: si lo igualara, cada despliegue reiniciaria la
      # cuenta y con despliegues diarios la tarea no correria nunca.
      retraso-inicial-minutos: ${PLAZO_ENTREGA_VIGILANCIA_RETRASO_INICIAL_MINUTOS:5}
  gcs:
    # bucket-imagenes y url-publica no son secretos (docs/07-infra-gcp.md los documenta), por eso
    # sí llevan default real de dev — a diferencia de los placeholders de Wompi de abajo, que son
    # secretos y nunca deben tener un valor real por defecto (regla dura #5). Las credenciales para
    # firmar las resuelve el SDK vía GOOGLE_APPLICATION_CREDENTIALS, fuera de este bloque.
    bucket-imagenes: ${GCS_BUCKET_IMAGENES:tecnosport-dev-imagenes}
    url-publica: ${GCS_URL_PUBLICA:https://storage.googleapis.com/tecnosport-dev-imagenes}
    minutos-url-firmada: ${GCS_MINUTOS_URL_FIRMADA:15}
  wompi:
    # Sin valor por defecto que sea una llave real (regla dura #5): los de abajo son placeholders
    # de sandbox para desarrollo local, nunca válidos contra Wompi. Producción los sobrescribe
    # siempre por variable de entorno, servida desde Secret Manager (docs/07-infra-gcp.md).
    llave-publica: ${WOMPI_LLAVE_PUBLICA:pub_test_placeholder}
    secreto-integridad: ${WOMPI_SECRETO_INTEGRIDAD:test_integrity_placeholder}
    secreto-eventos: ${WOMPI_SECRETO_EVENTOS:test_events_placeholder}
    ambiente: ${WOMPI_AMBIENTE:sandbox}
    metodos:
      # Lo que la CUENTA de Wompi tiene activado hoy, que no es lo mismo que lo que el codigo sabe
      # procesar. Separados por comas, de MetodoPago, y solo metodos que pasen por la pasarela.
      #
      # ADDI ESTA FUERA A PROPOSITO (decision del 14 de septiembre de 2026): Addi exige que el
      # sitio ya este en linea para estudiar la activacion, asi que hasta entonces ofrecerlo seria
      # prometer un medio de pago que no se puede honrar. El dia que lo activen se agrega ADDI
      # aqui, y hay que devolver la frase de los terminos que se quito con esto
      # (docs/11-pagos-y-envios.md).
      habilitados: ${WOMPI_METODOS_HABILITADOS:TARJETA,PSE,NEQUI,BANCOLOMBIA}
    conciliacion:
      intervalo-minutos: ${WOMPI_CONCILIACION_INTERVALO_MINUTOS:15}
      antiguedad-minima-minutos: ${WOMPI_CONCILIACION_ANTIGUEDAD_MINIMA_MINUTOS:15}
  contraentrega:
    # Dato de negocio real, no inventado (regla dura #5): arranca deshabilitada a proposito.
    # Se activa explicito cuando el negocio confirme la cobertura.
    habilitada: ${CONTRAENTREGA_HABILITADA:false}
    # El rango que recauda la transportadora, no una preferencia del negocio: COP 2.000 y
    # COP 2.000.000, lo que reporta la ayuda publica de Skydropx (docs/12-legales-de-envio.md, 4).
    # El maximo estuvo en 100000, declarado en este mismo sitio como marcador de desarrollo.
    # Se comparan contra el TOTAL del pedido, flete incluido: es lo que se cobra en la puerta.
    #
    # EL TECHO ES LA REGLA DE LO TECNOLOGICO, y conviene saberlo antes de tocarlo. La decision de
    # negocio del 14 de septiembre de 2026 es: lo tecnologico por encima de COP 2.000.000 no va
    # contra entrega, y un celular por debajo de esa cifra SI puede ir. Como el tope se compara
    # contra el total del pedido, este unico valor ya la implementa — nada que pase de 2.000.000
    # califica, sea un celular o una camiseta. Bajarlo volveria a excluir celulares que el
    # negocio si quiere despachar contra entrega.
    monto-minimo: ${CONTRAENTREGA_MONTO_MINIMO:2000}
    monto-maximo: ${CONTRAENTREGA_MONTO_MAXIMO:2000000}
    # Lista separada por comas de LineaCatalogo (ROPA_Y_CALZADO, BOLSOS, CELULARES).
    #
    # Vacia a proposito: la regla del negocio es por PRECIO, no por linea, y la implementa
    # monto-maximo. Excluir CELULARES entera bloquearia tambien los de 1.299.900 y 1.499.900, que
    # el negocio si quiere despachar contra entrega. Esta lista queda para el dia que alguna linea
    # no deba ir contra entrega a ningun precio, que hoy no es el caso de ninguna.
    categorias-excluidas: ${CONTRAENTREGA_CATEGORIAS_EXCLUIDAS:}
  skydropx:
    # El host de la cuenta colombiana NO está confirmado (docs/13-skydropx-capacidades.md, §6):
    # la documentación pública muestra pro.skydropx.com y sb-pro.skydropx.com, y según la fuente
    # aparecen también api-pro.skydropx.com y app.skydropx.com. Este valor por omisión apunta al
    # de pruebas y no sirve para cotizar de verdad — hoy no importa, porque el mapeo tampoco está
    # confirmado y el cliente falla cerrado.
    url-base: ${SKYDROPX_URL_BASE:https://sb-pro.skydropx.com}
    # Credenciales de desarrollo que no autentican contra nada (regla dura #5). Producción las
    # sobrescribe desde Secret Manager.
    client-id: ${SKYDROPX_CLIENT_ID:client_id_pendiente_de_configurar}
    client-secret: ${SKYDROPX_CLIENT_SECRET:client_secret_pendiente_de_configurar}
    # Parámetros técnicos del sondeo, no datos de negocio: la cotización es asíncrona y hay que
    # decidir cuánto se espera antes de darla por fallida. Diez segundos es lo que un comprador
    # tolera mirando un resumen de pedido sin total.
    cotizacion-timeout-segundos: ${SKYDROPX_COTIZACION_TIMEOUT_SEGUNDOS:10}
    cotizacion-intentos: ${SKYDROPX_COTIZACION_INTENTOS:8}
    webhook:
      # Dónde viene la firma del evento. Sigue siendo variable, pero ya no porque no se supiera:
      # la plataforma deja elegir el nombre de la cabecera en el panel, con Authorization por
      # omisión (docs/13-skydropx-capacidades.md, sección 6.1).
      cabecera-firma: ${SKYDROPX_CABECERA_FIRMA:authorization}
      # El secreto con el que Skydropx firma el evento. Lo ponemos nosotros y se teclea igual en el
      # panel (Conexiones > Webhooks): es una clave compartida, y se rota en los dos sitios o en
      # ninguno. Dev lo tiene desde el 16 de septiembre de 2026 y el valor de aquí sigue siendo un
      # marcador de desarrollo (regla dura #5): con él toda firma se rechaza, que es lo correcto
      # mientras no haya con qué verificar. Los despliegues lo sobrescriben desde Secret Manager.
      secreto: ${SKYDROPX_SECRETO_WEBHOOK:secreto_pendiente_de_configurar}
    seguimiento:
      # Cada cuánto le pregunta la conciliación a la transportadora por los envíos callados, y
      # desde cuándo se considera callado uno. Las doce horas no son capricho: menos que eso
      # pisaría al webhook, que suele traer el evento antes, y gastaría cuota de un proveedor
      # limitado a dos peticiones por segundo para llegar a la misma conclusión.
      intervalo-minutos: ${SKYDROPX_SEGUIMIENTO_INTERVALO_MINUTOS:360}
      antiguedad-minima-horas: ${SKYDROPX_SEGUIMIENTO_ANTIGUEDAD_MINIMA_HORAS:12}
      # Techo del lote: cada envío revisado es una llamada al proveedor, y la tarea corre dentro
      # de una transacción. Veinticinco a dos peticiones por segundo son unos trece segundos en el
      # peor caso; lo que no quepa espera a la vuelta siguiente.
      maximo-por-corrida: ${SKYDROPX_SEGUIMIENTO_MAXIMO_POR_CORRIDA:25}
    emision:
      # Mucho más seguido que el seguimiento, y con razón: el seguimiento vigila cosas que pasan en
      # días, y esto espera una respuesta que llega en segundos o minutos con un pedido pagado
      # esperándola. Medido: 25 s el caso bueno, más de 4 min el que terminó en error
      # (docs/13-skydropx-capacidades.md §6.10). Solo hay algo que revisar cuando alguien acaba de
      # pulsar el botón, así que el costo de la frecuencia es cero la mayor parte del tiempo.
      intervalo-segundos: ${SKYDROPX_EMISION_INTERVALO_SEGUNDOS:60}
  revision-envios:
    # Dato de negocio, a diferencia del intervalo de al lado: cuanto tiempo puede quedarse algo en
    # la bandeja de revision sin que nadie lo mire. Veinticuatro horas, porque el comprador de un
    # pedido despachado espera movimiento diario y enterarse despues que el es justo lo que la
    # bandeja vino a evitar.
    horas-umbral: ${ENVIO_REVISION_HORAS_UMBRAL:24}
    # Solo cada cuanto se mira. Seis horas contra un umbral de veinticuatro: lo bastante seguido
    # para que el aviso no llegue con medio dia de retraso, y lo bastante espaciado para que una
    # bandeja vacia no cueste nada.
    intervalo-minutos: ${ENVIO_REVISION_INTERVALO_MINUTOS:360}
    # Corto y menor que el intervalo, mismo motivo que el vigilante del plazo de entrega: si lo
    # igualara, cada despliegue reiniciaria la cuenta y con despliegues diarios no correria nunca.
    retraso-inicial-minutos: ${ENVIO_REVISION_RETRASO_INICIAL_MINUTOS:5}
    # No es un secreto: es el correo del negocio que ya esta publicado en el pie del sitio y en
    # los legales, asi que lleva valor por omision real (regla dura #5).
    destinatario: ${ENVIO_REVISION_DESTINATARIO:contacto@tecnosport.co}
  origen:
    # La dirección de despacho del negocio, que es la misma del punto de recogida y ya está
    # decidida (docs/09-plan-de-arranque.md, cierre de datos pendientes del 10/09/2026).
    nombre: ${ORIGEN_NOMBRE:TecnoSport}
    # El mismo celular que publica el pie del sitio y los textos legales (npm run datos-negocio
    # vigila que no se separen). No es un número inventado.
    telefono: ${ORIGEN_TELEFONO:+573138816711}
    # Entre comillas obligatorias: el "#" de la nomenclatura abre un comentario en YAML y la
    # dirección se cortaría en "Cra. 26C" sin que nada fallara.
    direccion: "${ORIGEN_DIRECCION:Cra. 26C # 38B-31, apto. 401, La Milagrosa}"
    # Los nombres, que Skydropx exige aparte del código DANE: sin ellos la cotización responde
    # 422 "area_level1/area_level2 no puede estar en blanco". Las grafías son las de DIVIPOLA,
    # las mismas que manda el frontend en la dirección de destino.
    departamento: ${ORIGEN_DEPARTAMENTO:Antioquia}
    ciudad: ${ORIGEN_CIUDAD:Medellín}
    # Medellín en DIVIPOLA. Ojo: esto es lo que Skydropx recibe como "postal_code" — su catálogo
    # es el DANE, no el postal de cinco dígitos.
    ciudad-dane: ${ORIGEN_CIUDAD_DANE:05001}
    # Opcional a propósito: en Colombia no se usa de forma fiable y muchas transportadoras lo
    # ignoran. Exigirlo impediría arrancar por un dato que a nadie le sirve.
    codigo-postal: ${ORIGEN_CODIGO_POSTAL:}
    # El barrio, y no es un adorno: viaja como area_level3 en la cotización, el envío lo hereda de
    # ahí, y sin él POST /pickups responde "Shipper address2 not valid" y GET /pickups/coverage
    # devuelve un 422 con el mensaje vacío. Dos sesiones dieron eso por roto del lado de Skydropx
    # y era esto (docs/13-skydropx-capacidades.md §6.10). Ya estaba dentro de `direccion` como
    # texto; la plataforma lo quiere en su propio campo.
    barrio: ${ORIGEN_BARRIO:La Milagrosa}
    # `reference` es obligatorio en la dirección de origen al emitir, y se imprime en la guía: es
    # lo que lee el mensajero que viene a recoger. Dato de negocio, decidido el 16/09/2026.
    referencia: ${ORIGEN_REFERENCIA:Apartamento 401}
    # No viaja en la cotización: lo exige la guía, que pide email en las dos direcciones. Es el
    # correo público del negocio —el mismo del pie y de los textos legales— y no el remitente
    # transaccional, porque lo que escriba la transportadora tiene que leerlo una persona.
    correo: ${ORIGEN_CORREO:contacto@tecnosport.co}
  transferencia-manual:
    # Dato de negocio real, no inventado (regla dura #5): estos placeholders nunca sirven para
    # transferir de verdad. Se sobrescriben con la cuenta real por variable de entorno.
    banco: ${TRANSFERENCIA_BANCO:banco_pendiente_de_configurar}
    tipo-cuenta: ${TRANSFERENCIA_TIPO_CUENTA:ahorros}
    numero-cuenta: ${TRANSFERENCIA_NUMERO_CUENTA:000000000}
    titular: ${TRANSFERENCIA_TITULAR:TecnoSport SAS}
  jwt:
    # Placeholder de al menos 32 bytes (HS256 lo exige) — nunca un secreto real
    # (regla dura #5). Producción lo sobrescribe desde Secret Manager.
    secreto: ${JWT_SECRETO:placeholder_jwt_secreto_de_desarrollo_no_usar_en_produccion}
    minutos-acceso: ${JWT_MINUTOS_ACCESO:15}
    dias-refresco: ${JWT_DIAS_REFRESCO:30}
  admin-semilla:
    # Dato de negocio real, no inventado (regla dura #5): cambiar antes de desplegar a producción.
    correo: ${ADMIN_CORREO:admin@tecnosport.co}
    clave: ${ADMIN_CLAVE:admin_clave_de_desarrollo_cambiar}
  carrito:
    purga:
      # docs/02-modelo-datos.md: "el carrito vive 30 días". Se cuentan desde la última actividad,
      # no desde la creación (ver Carrito).
      dias-retencion: ${CARRITO_DIAS_RETENCION:30}
      # En horas, no en minutos: purgar carritos no es urgente, y barrer seguido una tabla que casi
      # nunca tiene nada que borrar solo gasta base de datos.
      intervalo-minutos: ${CARRITO_PURGA_INTERVALO_MINUTOS:360}
  legal:
    # Fecha de vigencia del texto publicado en /legales/privacidad. Va acoplada al texto, que vive
    # en los JSON de Transloco de este mismo repositorio: cambiar el texto y cambiar esta fecha son
    # el mismo commit. La variable existe para poder corregirla sin redesplegar, no para tener que
    # fijarla en cada entorno.
    politica-datos-version: ${POLITICA_DATOS_VERSION:2026-09-14}
  verificacion-correo:
    # Ningún doc especifica esta duración (solo la de recuperación, 30 min) — parámetro técnico,
    # no un dato de negocio.
    horas-vencimiento: ${VERIFICACION_CORREO_HORAS_VENCIMIENTO:24}
  recuperacion-clave:
    # docs/08-seguridad-legal.md: "token de un solo uso, válido 30 minutos".
    minutos-vencimiento: ${RECUPERACION_CLAVE_MINUTOS_VENCIMIENTO:30}
  garantia:
    # Doce meses para producto nuevo, que es lo que prometen los terminos publicados. Un productor
    # puede anunciar uno mayor: eso va en meses-por-categoria.
    meses-por-defecto: ${GARANTIA_MESES_POR_DEFECTO:12}
    # categorias-sin-termino-conocido impide inventar un dato: una categoria listada aqui responde
    # INDETERMINADA en vez de caer a los doce meses generales. Hoy va vacia. Los celulares estuvieron
    # ahi por un malentendido: los terminos prometian "la garantia del fabricante" y se trato como
    # dato pendiente del negocio, pero el termino lo fija la ley — un ano para producto nuevo,
    # celulares incluidos (art. 8 de la Ley 1480 de 2011 y concepto de la SIC sobre equipos
    # terminales, verificados el 10 de septiembre de 2026). Si algun productor anuncia uno mayor, va
    # en meses-por-categoria, que es lo que la ley manda respetar.
    categorias-sin-termino-conocido: ${GARANTIA_CATEGORIAS_SIN_TERMINO:}
  atencion:
    # Plazos de respuesta en dias habiles. Los dos primeros son de la Ley 1581 de 2012 (consultas y
    # reclamos de datos personales, con sus prorrogas); el tercero es el que los terminos publicados
    # prometen para las peticiones del consumidor, y ese texto no menciona prorroga.
    dias-consulta-datos: ${ATENCION_DIAS_CONSULTA_DATOS:10}
    dias-prorroga-consulta-datos: ${ATENCION_DIAS_PRORROGA_CONSULTA_DATOS:5}
    dias-reclamo-datos: ${ATENCION_DIAS_RECLAMO_DATOS:15}
    dias-prorroga-reclamo-datos: ${ATENCION_DIAS_PRORROGA_RECLAMO_DATOS:8}
    dias-consumidor: ${ATENCION_DIAS_CONSUMIDOR:15}
  limite-intentos:
    # docs/08-seguridad-legal.md pide el límite, pero no da números — dato de seguridad, no de
    # negocio, ajustable. "auth" agrupa sesión/registro/recuperación (mismo tipo de abuso);
    # "pedidos" es más generoso porque reintentar una compra es normal.
    auth:
      ip-maximo: ${LIMITE_AUTH_IP_MAXIMO:15}
      ip-minutos: ${LIMITE_AUTH_IP_MINUTOS:15}
      cuenta-maximo: ${LIMITE_AUTH_CUENTA_MAXIMO:5}
      cuenta-minutos: ${LIMITE_AUTH_CUENTA_MINUTOS:15}
    # La cotización llama a un proveedor externo con cuota y se paga: es el único endpoint
    # público con ese riesgo. Generoso a propósito — un comprador corrige la dirección varias
    # veces; el tope frena a un script, no a una persona indecisa.
    cotizacion:
      ip-maximo: ${LIMITE_COTIZACION_IP_MAXIMO:60}
      ip-minutos: ${LIMITE_COTIZACION_IP_MINUTOS:30}
    pedidos:
      ip-maximo: ${LIMITE_PEDIDOS_IP_MAXIMO:30}
      ip-minutos: ${LIMITE_PEDIDOS_IP_MINUTOS:60}
      cuenta-maximo: ${LIMITE_PEDIDOS_CUENTA_MAXIMO:15}
      cuenta-minutos: ${LIMITE_PEDIDOS_CUENTA_MINUTOS:60}

springdoc:
  api-docs:
    path: /api/openapi.json
  swagger-ui:
    path: /api/docs
