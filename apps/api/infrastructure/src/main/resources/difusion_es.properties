# Los textos del pie que acompaña cada publicación en Facebook e Instagram (ADR-0102, ADR-0107).
#
# El armador (ArmadorDePieDeFoto) decide el orden y los datos; aquí vive lo que se lee. Las
# llaves están en el enum TextoDeDifusion, y TextosDeDifusionMessageSource se niega a arrancar si
# falta alguna en cualquiera de los dos idiomas.
#
# Son patrones de MessageFormat: un apóstrofe suelto se come el marcador que sigue. Si hace falta
# uno, va doble ('').
#
# Cada renglón de texto acaba en punto (ADR-0107), salvo tres: el de la entrada, porque después
# del precio el punto se lee como separador de miles; los que acaban en una URL, porque Facebook
# puede tragárselo dentro del enlace; y los hashtags. El punto de la descripción y de sus viñetas
# lo pone el armador, que no sabe si quien las escribió ya lo puso.
#
# El teléfono, el enlace de WhatsApp y los de las redes los vigila `npm run datos-negocio`, igual
# que los del pie de los correos.

# {0} emoji de la categoría, {1} nombre del producto, {2} precio ya escrito
entrada={0} {1} · {2}
precio.unico=${0}
precio.desde=desde ${0}
# El de la categoría que no tiene emoji, ni ella ni su rama.
emoji.por_omision=📦

# {0} una viñeta de la descripción, sin su marca y ya con su punto
vineta=✔️ {0}

# {0} nombre del atributo, {1} sus valores separados por coma
atributo.talla=📏 {0}: {1}.
atributo.color=🎨 {0}: {1}.
atributo.otro=▪️ {0}: {1}.

pago.titulo=💰 Diferentes opciones de pago:
pago.tarjeta=💳 Tarjeta débito o crédito y PSE.
pago.contraentrega=💵 Pago contraentrega.
pago.transferencia=📲 Transferencia.
# Cada crédito solo si está habilitado y la variante más cara alcanza su mínimo.
pago.credito.addi_y_sistecredito=🏦 Addi o Sistecrédito.
pago.credito.addi=🏦 Addi.
pago.credito.sistecredito=🏦 Sistecrédito.
pago.recogida=📍 Opción de recogida en nuestro punto físico.
envio=🚚 Envíos a toda Colombia.

# {0} el enlace a la ficha del producto. En Instagram un enlace del pie no se puede tocar.
llamado.facebook=👉 ¿Te interesa este producto?. Míralo y cómpralo aquí:\n{0}
llamado.instagram=👉 ¿Te interesa este producto?. Cómpralo desde el enlace de nuestra bio 🔗.

# {0} el enlace de WhatsApp (url.whatsapp)
whatsapp.facebook=💬 ¿Dudas?. Escríbenos por WhatsApp:\n{0}
whatsapp.instagram=💬 ¿Dudas?. Escríbenos por WhatsApp al 313 881 6711.

# Cada red remite a la otra: en un post de Facebook el enlace a Facebook no aporta nada.
# {0} el enlace a la otra red (url.facebook o url.instagram)
redes.facebook=Síguenos en Facebook:\n{0}
redes.instagram=Síguenos en Instagram:\n{0}
# {0} la portada del sitio
sitio=Visita nuestro sitio web para ver más productos:\n{0}

url.whatsapp=https://wa.me/573138816711
url.facebook=https://www.facebook.com/tecnosport.co
url.instagram=https://www.instagram.com/tecnosport_co/
