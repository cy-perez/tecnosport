# Los textos del pie que acompaña cada publicación en Facebook e Instagram (ADR-0102).
#
# El armador (ArmadorDePieDeFoto) decide el orden y los datos; aquí vive lo que se lee. Las
# llaves están en el enum TextoDeDifusion, y TextosDeDifusionMessageSource se niega a arrancar si
# falta alguna en cualquiera de los dos idiomas.
#
# Son patrones de MessageFormat: un apóstrofe suelto se come el marcador que sigue. Si hace falta
# uno, va doble ('').
#
# El teléfono lo vigila `npm run datos-negocio`, igual que el del pie de los correos.

# {0} nombre del producto, {1} precio ya escrito (precio.unico o precio.desde)
entrada=✨ {0} · {1}
precio.unico=${0}
precio.desde=desde ${0}

# {0} una viñeta de la descripción, sin su marca
vineta=✔️ {0}

# {0} nombre del atributo, {1} sus valores separados por coma
atributo.color=🎨 {0}: {1}
atributo.otro=▪️ {0}: {1}

confianza.envio=🚚 Envío a todo Colombia
confianza.pago_con_contraentrega=💳 Paga en línea, o contra entrega si tu ciudad tiene cobertura
confianza.pago_en_linea=💳 Paga en línea
confianza.whatsapp=💬 ¿Dudas? Escríbenos por WhatsApp al 313 881 6711

# {0} el enlace a la ficha del producto
llamado.facebook=👉 Míralo y cómpralo aquí: {0}
llamado.instagram=👉 Cómpralo desde el enlace de nuestra bio
