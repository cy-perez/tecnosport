atencion.acuse.asunto=We filed your request {0} — TecnoSport
atencion.acuse.cuerpo=<p>We filed your request under number <strong>{0}</strong>. Keep it: with \
that number you can ask us about it whenever you want.</p>\
<p>Subject: {1}</p>\
<p>We will answer within the term that applies to your request. If we need more time than expected \
and the law allows it, we will tell you before that term expires, with the reasons.</p>

atencion.prorroga.asunto=We need more time with your request {0} — TecnoSport
atencion.prorroga.cuerpo=<p>About your request <strong>{0}</strong>: we need more time to answer \
you properly, and the law lets us extend the term by telling you before it expires, with the \
reasons.</p>\
<p>Reason: {1}</p>\
<p>We will answer within the extended term.</p>

usuario.verificacion.asunto=Verify your email — TecnoSport
usuario.verificacion.cuerpo=<p>Thanks for signing up to TecnoSport.</p>\
<p>Confirm your email so you can sign in:</p>\
<p><a href="{0}">Verify my email</a></p>

usuario.recuperacion.asunto=Reset your password — TecnoSport
usuario.recuperacion.cuerpo=<p>You asked to reset your TecnoSport password.</p>\
<p>Choose a new one:</p>\
<p><a href="{0}">Reset my password</a></p>\
<p>If this was not you, ignore this email.</p>
envio.revision_pendiente.asunto=Shipment review pending ({0}) — TecnoSport
envio.revision_pendiente.cuerpo=<p>The following has been in the review queue for more than {0} hours and nobody has looked at it yet.</p><ul>
envio.revision_pendiente.guia=<li>Tracking {0}, order {1}: {2}. Last update on {3}.</li>
envio.revision_pendiente.emision=<li>Order {0}, {1}: label purchase {2}, with money committed. Rate {3}.</li>
envio.saldo_bajo.asunto=Low balance for buying labels ({0}) — TecnoSport
envio.saldo_bajo.cuerpo=<p>The shipping platform account has <strong>{0}</strong> in credit, below the minimum of {1} set by the business.</p><p>Without credit no label can be bought: paid orders stay in preparation and dispatch stops, with no way for the buyer to know why. Top-ups are requested directly from Skydropx.</p>
envio.revision_pendiente.cierre=</ul><p>Handle it in the admin panel, under shipment review. Marking something as reviewed records who looked at it; an unresolved label purchase is also resolved there, and until it is resolved that order cannot buy another label.</p>
envio.sobrecosto.asunto=The carrier charged extra on {0} shipment(s) — TecnoSport
envio.sobrecosto.cuerpo=<p>The shipping platform recorded <strong>{0}</strong> new extra charge(s). They have already been taken from the account credit, so the shipping cost stored on these orders is lower than what was actually paid.</p><ul>
envio.sobrecosto.cobro=<li><strong>{0}</strong> for {1} — order {6}, tracking {2} ({3}), detected on {4}. Shipment {5} on the platform.</li>
envio.sobrecosto.cierre=</ul><p>The detail is in the Skydropx panel, under Finance. The most common reason is overweight: the parcel weighed more than the variant declares, and then what needs fixing is the product measurement in the catalogue, not this shipment.</p>
envio.sobrecosto.sin_guia=no tracking number
envio.sobrecosto.sin_fecha=date not reported
envio.sobrecosto.sin_pedido=not identified

pedido.comprobante.asunto=Receipt for your order {0} — TecnoSport
pedido.comprobante.cuerpo=<p>Thank you for your purchase. This is the receipt for order <strong>{0}</strong>, placed on {1}.</p><h3>What you bought</h3><ul>
pedido.comprobante.linea=<li>{0} × {1} ({2}) — COP {3}</li>
pedido.comprobante.totales=</ul><p>Subtotal: COP {0}<br>Shipping: COP {1}<br><strong>Total: COP {2}</strong></p>
pedido.comprobante.entrega_domicilio=<p><strong>Delivery:</strong> to the address you gave us.</p>
pedido.comprobante.entrega_retiro=<p><strong>Delivery:</strong> you pick your order up at our Medellín location, with no shipping cost.</p>
pedido.comprobante.pago_contraentrega=<p><strong>Payment:</strong> cash on delivery. You pay the total when you receive the order.</p>
pedido.comprobante.pago_transferencia=<p><strong>Payment:</strong> bank transfer.</p>
pedido.comprobante.pago_en_linea=<p><strong>Payment:</strong> online, through our payment gateway.</p>
pedido.comprobante.vendedor=<h3>Who sold to you</h3><p>Cristhian Yurday Pérez Hoyos — NIT 1054994043-9<br>Carrera 26C # 38B-31, Medellín, Antioquia, Colombia<br>contacto@tecnosport.co — 313 881 6711</p>
pedido.comprobante.cierre=<p>Keep this receipt: it is the proof of your purchase and you need it to claim the warranty.</p><p><strong>This document is not a sales invoice.</strong> Tecno Sport is not a VAT (IVA) taxpayer and is not required to issue invoices, under article 1.6.1.4.3 of Decree 1625 of 2016.</p><p>You can check your order status here:</p><p><a href="{0}">View my order status</a></p>
