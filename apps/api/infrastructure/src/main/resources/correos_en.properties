# The English versions. Nobody can ask for them yet: neither Pedido nor Usuario stores a language,
# so TextosDeCorreoMessageSource always resolves Spanish -- and that is the defensible answer, not a
# shortcut: Ley 1480 de 2011 requires the minimum information in Spanish (art. 23) and Spanish in
# contracts (art. 37.1), which is why the published legal documents carry the courtesy note saying
# the Spanish version governs.
#
# They are not dead weight either: the adapter resolves every key in both languages at startup, so a
# missing English text stops the service from booting. The day an order records the buyer language,
# the adapter takes a parameter and this file is already written.

retracto.acuse.asunto=We received your withdrawal request — TecnoSport
retracto.acuse.cuerpo=<p>We received your withdrawal request for order {0}.</p>\
<p>To complete it, send the product back in the same condition you received it. The buyer pays the \
return shipping, under article 47 of Ley 1480 de 2011.</p>\
<p>Once the product arrives and we have the details for the refund, we return your money within \
fifteen (15) calendar days, through the payment method you prefer. If you have not told us which \
one, reply to this email and we will note it.</p>

retracto.reintegro.asunto=We refunded your order — TecnoSport
retracto.reintegro.cuerpo=<p>We refunded {0} {1} for order {2}.</p>\
<p>Depending on the method, the money may take a while to show up in your account. If you do not \
see it after a few days, write to us and we will look into it with you.</p>

pedido.cancelacion.asunto=We cancelled your order {0} — TecnoSport
pedido.cancelacion.no_disponibilidad=<p>A product in your order stopped being available after your \
purchase, so we cancelled the order.</p>
pedido.cancelacion.plazo_incumplido=<p>We could not deliver within the deadline, so we cancelled \
the order.</p>
pedido.cancelacion.con_reintegro=<p>We are refunding your money through the agreed method. \
Depending on the method, it may take a while to show up in your account.</p>
pedido.cancelacion.sin_cobro=<p>You were not charged for this order.</p>
pedido.cancelacion.cierre=<p>If you want to try again, write to us and we will help you.</p>

pedido.despacho.asunto=We shipped your order {0} — TecnoSport
pedido.despacho.cuerpo=<p>Your order {0} is on its way to the address you gave us.</p>\n<p>We shipped it with {1}, tracking number {2}.</p>\n<p>You can check your order status here:</p>\n<p><a href="{3}">See my order status</a></p>
pedido.despacho.cuerpo_varias=<p>Your order {0} is on its way to the address you gave us, in {1} packages.</p>
<p>They travel separately and may arrive on different days. Each one has its own tracking number: {2}.</p>
<p>You can check your order status here:</p>
<p><a href="{3}">See my order status</a></p>

pedido.plazo_vencido.asunto=Your order {0} is past the delivery deadline — TecnoSport
pedido.plazo_vencido.cuerpo=<p>The thirty (30) calendar days we had to deliver your order have \
passed and, according to our records, we have not delivered it yet. We are sorry.</p><p>Under \
article 18 of Law 1480 of 2011 you may terminate the contract, without having to explain why. You \
may also wait: it is your decision, and unless you tell us otherwise we keep working on your \
order.</p>
pedido.plazo_vencido.en_camino=<p>Your order has already shipped and is on its way. If you have \
received it, write to us and we will correct it: we mark the delivery date by hand and we may have \
fallen behind.</p><p>If you would rather terminate the contract, reply to this email: since the \
order is already with the carrier, we will arrange the return with you and, once the product is \
back, we will refund whatever you paid.</p>
pedido.plazo_vencido.con_dinero=<p>If you decide to terminate the contract, we will refund what \
you paid. Reply to this email and tell us which method you prefer for the refund.</p>
pedido.plazo_vencido.sin_cobro=<p>You have not been charged for this order yet, so there is no \
money to refund. If you decide to terminate the contract, reply to this email and we will cancel \
it.</p>
pedido.plazo_vencido.cierre=<p>If you prefer to wait, you do not need to do anything: we keep \
working on your order and will tell you about any news.</p>

