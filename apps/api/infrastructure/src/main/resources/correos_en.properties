atencion.acuse.asunto=We filed your request {0} — TecnoSport
atencion.acuse.cuerpo=<p>We filed your request under number <strong>{0}</strong>. Keep it: with \
that number you can ask us about it whenever you want.</p>\
<p>Subject: {1}</p>\
<p>We will answer within the term that applies to your request. If we need more time than expected \
and the law allows it, we will tell you before that term expires, with the reasons.</p>

atencion.prorroga.asunto=We need more time with your request {0} — TecnoSport
atencion.prorroga.cuerpo=<p>About your request <strong>{0}</strong>: we need more time to answer \
you properly, and the law lets us extend the term by telling you before it expires, with the \
reasons.</p>\
<p>Reason: {1}</p>\
<p>We will answer within the extended term.</p>

usuario.verificacion.asunto=Verify your email — TecnoSport
usuario.verificacion.cuerpo=<p>Thanks for signing up to TecnoSport.</p>\
<p>Confirm your email so you can sign in:</p>\
<p><a href="{0}">Verify my email</a></p>

usuario.recuperacion.asunto=Reset your password — TecnoSport
usuario.recuperacion.cuerpo=<p>You asked to reset your TecnoSport password.</p>\
<p>Choose a new one:</p>\
<p><a href="{0}">Reset my password</a></p>\
<p>If this was not you, ignore this email.</p>
