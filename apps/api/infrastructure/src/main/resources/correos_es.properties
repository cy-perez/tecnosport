atencion.acuse.asunto=Radicamos tu solicitud {0} — TecnoSport
atencion.acuse.cuerpo=<p>Radicamos tu solicitud con el número <strong>{0}</strong>. Guárdalo: con \
ese número puedes preguntarnos por ella cuando quieras.</p>\
<p>Asunto: {1}</p>\
<p>Te respondemos dentro del plazo que corresponde a tu solicitud. Si necesitamos más tiempo del \
previsto y la ley lo permite, te avisamos antes de que ese plazo venza, con los motivos.</p>

atencion.prorroga.asunto=Necesitamos más tiempo con tu solicitud {0} — TecnoSport
atencion.prorroga.cuerpo=<p>Sobre tu solicitud <strong>{0}</strong>: necesitamos más tiempo para \
responderte de fondo, y la ley nos permite prorrogar el plazo avisándote antes de que venza, con \
los motivos.</p>\
<p>Motivo: {1}</p>\
<p>Te respondemos dentro del plazo prorrogado.</p>

usuario.verificacion.asunto=Verifica tu correo — TecnoSport
usuario.verificacion.cuerpo=<p>Gracias por registrarte en TecnoSport.</p>\
<p>Confirma tu correo para poder iniciar sesión:</p>\
<p><a href="{0}">Verificar mi correo</a></p>

usuario.recuperacion.asunto=Recupera tu contraseña — TecnoSport
usuario.recuperacion.cuerpo=<p>Pediste recuperar tu contraseña en TecnoSport.</p>\
<p>Elige una nueva:</p>\
<p><a href="{0}">Restablecer mi clave</a></p>\
<p>Si no fuiste tú, ignora este correo.</p>
