# Los textos de los correos transaccionales. Fuera del codigo por la regla dura #4 del CLAUDE.md:
# antes se concatenaban dentro de cada caso de uso, en un solo idioma y sin una sola tilde.
#
# Las llaves las declara el enum TextoDeCorreo, y TextosDeCorreoMessageSource resuelve todas al
# arrancar: si falta una, el servicio no levanta.
#
# Dos cuidados al editar:
#  - Nada de apostrofes: con argumentos, esto lo formatea MessageFormat, que los trata como
#    caracter de escape y habria que doblarlos.
#  - Los {0} se rellenan con datos ya escapados para HTML. No hace falta escapar nada a mano.

retracto.acuse.asunto=Recibimos tu solicitud de retracto — TecnoSport
retracto.acuse.cuerpo=<p>Recibimos tu solicitud de retracto del pedido {0}.</p>\
<p>Para completarla, devuélvenos el producto en el mismo estado en que lo recibiste. El costo del \
transporte de la devolución lo asume el comprador, según el artículo 47 de la Ley 1480 de 2011.</p>\
<p>Cuando el producto llegue, te reintegramos el dinero dentro de los quince (15) días calendario \
siguientes, por el medio de pago que prefieras. Si no nos has dicho cuál, respóndenos este correo \
y lo anotamos.</p>

retracto.reintegro.asunto=Reintegramos el dinero de tu pedido — TecnoSport
retracto.reintegro.cuerpo=<p>Reintegramos {0} {1} del pedido {2}.</p>\
<p>Según el medio, el dinero puede tardar en reflejarse en tu cuenta. Si pasados unos días no lo \
ves, escríbenos y lo revisamos contigo.</p>

pedido.cancelacion.asunto=Cancelamos tu pedido {0} — TecnoSport
pedido.cancelacion.no_disponibilidad=<p>Un producto de tu pedido dejó de estar disponible después \
de tu compra, así que cancelamos el pedido.</p>
pedido.cancelacion.plazo_incumplido=<p>No pudimos entregarte dentro del plazo, así que cancelamos \
el pedido.</p>
pedido.cancelacion.con_reintegro=<p>Te reintegramos el dinero por el medio acordado. Según el \
medio, puede tardar en reflejarse en tu cuenta.</p>
pedido.cancelacion.sin_cobro=<p>No se te cobró nada por este pedido.</p>
pedido.cancelacion.cierre=<p>Si quieres volver a intentarlo, escríbenos y te ayudamos.</p>

atencion.acuse.asunto=Radicamos tu solicitud {0} — TecnoSport
atencion.acuse.cuerpo=<p>Radicamos tu solicitud con el número <strong>{0}</strong>. Guárdalo: con \
ese número puedes preguntarnos por ella cuando quieras.</p>\
<p>Asunto: {1}</p>\
<p>Te respondemos dentro del plazo que corresponde a tu solicitud. Si necesitamos más tiempo del \
previsto y la ley lo permite, te avisamos antes de que ese plazo venza, con los motivos.</p>

atencion.prorroga.asunto=Necesitamos más tiempo con tu solicitud {0} — TecnoSport
atencion.prorroga.cuerpo=<p>Sobre tu solicitud <strong>{0}</strong>: necesitamos más tiempo para \
responderte de fondo, y la ley nos permite prorrogar el plazo avisándote antes de que venza, con \
los motivos.</p>\
<p>Motivo: {1}</p>\
<p>Te respondemos dentro del plazo prorrogado.</p>

usuario.verificacion.asunto=Verifica tu correo — TecnoSport
usuario.verificacion.cuerpo=<p>Gracias por registrarte en TecnoSport.</p>\
<p>Confirma tu correo para poder iniciar sesión:</p>\
<p><a href="{0}">Verificar mi correo</a></p>

usuario.recuperacion.asunto=Recupera tu contraseña — TecnoSport
usuario.recuperacion.cuerpo=<p>Pediste recuperar tu contraseña en TecnoSport.</p>\
<p>Elige una nueva:</p>\
<p><a href="{0}">Restablecer mi clave</a></p>\
<p>Si no fuiste tú, ignora este correo.</p>
